<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="sm-default-theme" content="%SM_DEFAULT_THEME%" />
    <title>Supermixer</title>
    <!-- Served by the Go backend; falls back to the bundled copy in /public. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Brand colours derived from appearance.brand_color, generated by the Go backend. -->
    <link rel="stylesheet" href="/theme.css" />
    <script>
      // Apply the theme before first paint so the page never flashes.
      ;(function () {
        var pref
        try {
          pref = localStorage.getItem('supermixer.theme')
        } catch (e) {}
        if (pref !== 'dark' && pref !== 'light' && pref !== 'system') {
          var meta = document.querySelector('meta[name="sm-default-theme"]')
          pref = meta && /^(dark|light|system)$/.test(meta.content) ? meta.content : 'dark'
        }
        var resolved =
          pref === 'system'
            ? window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
            : pref
        var root = document.documentElement
        root.setAttribute('data-theme', resolved)
        root.style.colorScheme = resolved
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
