# Supermixer configuration. Copy to .env.toml and adjust (`make env` does
# this and generates an encryption key). Start the server with
# `supermixer --config path/to/file.toml`; the default is ./.env.toml.
#
# Every setting can be overridden by an environment variable named after its
# key: SUPERMIXER_<SECTION>_<KEY>, e.g. database.url → SUPERMIXER_DATABASE_URL,
# security.sign_in.lockout → SUPERMIXER_SECURITY_SIGN_IN_LOCKOUT. Unknown keys
# are an error. Durations look like "90s", "15m" or "168h".

[server]
# Address the HTTP server listens on.
listen = ":8080"
# URL users reach Supermixer at (used for invitation links and secure cookies).
public_url = "http://localhost:8080"
# Set to true only behind a reverse proxy that sets X-Forwarded-For /
# X-Real-IP. Client IPs are used for sign-in limits and the audit log.
trust_proxy = false

[log]
# debug | info | warn | error
level = "info"
# text | json
format = "text"

[database]
# Supermixer's own PostgreSQL database, separate from the Supabase stacks it
# manages. deploy/docker-compose.yml starts one on port 5433.
url = "postgres://supermixer:supermixer@localhost:5433/supermixer?sslmode=disable"
# Connections Supermixer keeps to it; 0 lets the driver decide.
max_connections = 0

[security]
# 32 random bytes, base64-encoded. Encrypts stored Supabase credentials.
# Generate with: openssl rand -base64 32
# Changing it makes previously stored credentials unreadable.
encryption_key = ""
# How long a sign-in lasts.
session_ttl = "168h"

[security.sign_in]
# Wrong passwords allowed per client IP and per username before a lockout.
max_failures = 10
lockout = "15m"

[bootstrap_admin]
# The first instance admin, created on first start when no users exist. It
# has to choose a new password when it first signs in. Leave password empty
# to have Supermixer generate a one-time password and print it in its log.
username = "admin"
password = ""

[appearance]
# Brand colour used in place of Supabase green. Default: Piccadilly blue
# (TfL Piccadilly line, Pantone 072). Any #RRGGBB works; shades are derived
# automatically. Takes effect on restart, no rebuild needed.
brand_color = "#0019A8"
# dark | light | system: the theme for users who haven't chosen one under
# Account › Appearance (their choice is saved on their account).
default_theme = "light"

[projects]
# How Supermixer talks to the Supabase stacks it manages.
# Per-service timeout for health checks, and how long results are reused.
health_check_timeout = "5s"
health_cache_ttl = "15s"
# SQL Editor and catalog queries: statement timeout, and rows returned unless
# the caller asks for more (up to 10000).
query_timeout = "60s"
query_max_rows = 1000
# Database connections kept per project.
db_pool_size = 4
# Time to wait for a stack's API gateway (Auth, Storage, Data API calls).
gateway_timeout = "60s"

[provisioning]
# Let Supermixer create Supabase stacks itself (New project › Create a new
# stack), running Supabase's own compose files with the docker CLI. Off by
# default: control of the Docker daemon is root-equivalent on the host.
enabled = false
# One folder per stack (compose files, .env, volumes). Compose resolves bind
# mounts on the Docker host, so if Supermixer runs in a container, mount this
# folder at the same path inside it.
stacks_dir = "/var/lib/supermixer/stacks"
# The docker CLI, with the compose plugin.
docker = "docker"
# The host name in stacks' URLs, as people and apps reach them.
public_host = "localhost"
# How Supermixer reaches the stacks; empty means public_host. In a container,
# use host.docker.internal or the host's address.
connect_host = ""
# Host port ranges ("first-last"); each stack takes one port from each:
# its API gateway, Postgres (session mode, through the pooler) and the
# pooler's transaction mode.
api_ports = "8200-8299"
db_ports = "54400-54499"
pooler_ports = "64400-64499"
# Longest a stack may take to start, image downloads included.
start_timeout = "20m"
# Database backups of created stacks: Supabase-style dumps (roles, schema,
# data) in one folder per stack. Storage files aren't included, as in
# Supabase's own backups.
backups_dir = "/var/lib/supermixer/backups"
# How often each running stack is backed up; "0s" turns scheduled backups off.
backup_interval = "24h"
# Scheduled backups kept per stack (manual ones are kept until deleted).
backup_keep = 7

[provisioning.backup_s3]
# Copy each backup to an S3-compatible bucket too (AWS S3, MinIO, Cloudflare
# R2, ...), so a lost host doesn't take its backups with it. Off while bucket
# is empty. Supermixer only adds, reads and removes objects under prefix.
bucket = ""
# The service's URL: https://s3.<region>.amazonaws.com for AWS, or your
# MinIO's / R2's endpoint.
endpoint = ""
region = ""
# Objects go to <prefix>/<project ref>/<backup id>/.
prefix = "supermixer"
# Leave both empty to use the AWS environment variables or the host's IAM
# role. Better set through SUPERMIXER_PROVISIONING_BACKUP_S3_SECRET_ACCESS_KEY.
access_key_id = ""
secret_access_key = ""
# Bucket in the URL's path rather than its host name: true for MinIO,
# most other services and bucket names with dots; false for AWS.
path_style = false
# Keep backups in backups_dir after they're copied. With false they're only
# in the bucket once uploaded, and restoring or downloading fetches them.
keep_local = true

[email]
# Sending email: invitation links, password-reset links ("Forgot your
# password?" on the sign-in page) and security notices (password changed,
# two-factor sign-in turned off). Off while smtp_host is empty; invitations
# then give a link to share yourself, and only an instance admin can reset a
# password. For local testing, `make mail` runs Mailpit: smtp_host =
# "localhost", smtp_port = 1025, security = "none", and read the mail at
# http://localhost:8025.
smtp_host = ""
smtp_port = 587
# starttls (port 587), tls (port 465) or none (a relay on this host or a
# trusted network only).
security = "starttls"
# Leave both empty if the server doesn't ask. Better set the password
# through SUPERMIXER_EMAIL_PASSWORD.
username = ""
password = ""
from = "Supermixer <supermixer@example.com>"
timeout = "15s"

# Single sign-on through OpenID Connect providers (Okta, Microsoft Entra ID,
# Google Workspace, Keycloak, Authentik, Dex, ...): a "Continue with <name>"
# button on the sign-in page for each. Register this redirect URI with the
# provider: <server.public_url>/api/v1/auth/sso/<id>/callback.
#
# Accounts are never matched by email: people connect a provider to their
# account under Account › Security, or, with create_users, get an account
# when they first sign in. Accounts with two-factor sign-in still enter
# their code. For local testing, `make sso` runs Dex (see
# deploy/dev-sso/dex.yaml).
[sso]
# None by default. To add one, delete this line and add a [[sso.providers]]
# table like the example below for each.
providers = []
#
# [[sso.providers]]
# id = "okta"                       # in its URLs: a-z, 0-9, -
# name = "Okta"                     # on the button
# issuer = "https://example.okta.com"
# client_id = "..."
# client_secret_file = "/run/secrets/okta"   # or client_secret = "..."
# scopes = ["openid", "email", "profile"]
# allowed_domains = ["example.com"] # email domains it may sign in; empty: any
# create_users = false              # make accounts for new people
# assume_email_verified = false     # trust emails without email_verified (Entra ID)

[metrics]
# Prometheus metrics at http://<listen>/metrics: HTTP requests, sign-ins,
# emails, audit drains, users, projects, stacks and each project's last
# backup. Off while empty. It isn't authenticated: listen on a private
# address, like 127.0.0.1:9100 or the pod's own.
listen = ""

[audit]
# Send audit log entries elsewhere as they're written (a SIEM, a log
# pipeline): at least once, in order, resuming after restarts and outages.
# A new drain starts with the entries written after it's added. None by
# default: to add one, delete this line and add [[audit.drains]] tables.
drains = []
#
# [[audit.drains]]
# id = "siem"                       # a-z, 0-9, -
# type = "http"                     # POST a JSON array of entries
# url = "https://siem.example.com/ingest/supermixer"
# headers = { Authorization = "Bearer ..." }
#
# [[audit.drains]]
# id = "file"
# type = "file"                     # append JSON lines, for a log shipper
# path = "/var/log/supermixer/audit.jsonl"
