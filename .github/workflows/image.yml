# Builds Supermixer's container image for amd64 and arm64 when a version tag
# is pushed (git tag v0.2.0 && git push origin v0.2.0), and pushes it to
# Docker Hub as supermixer/supermixer:0.2.0, :0.2 and :latest (not :0.2 or
# :latest for a pre-release such as v0.2.0-rc.1).
#
# Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a
# Docker Hub access token with Read & Write on supermixer/supermixer).
name: Image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: supermixer/supermixer
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
