openapi: 3.0.3
info:
  title: Supermixer API
  version: 0.3.0
  description: |
    Management API for Supermixer, an on-premise management plane for
    self-hosted Supabase. Resource paths follow the shape of the Supabase
    Management API (https://api.supabase.com/api/v1) where a concept exists in both.

    Authentication is a session cookie set by `POST /auth/sign-in`. Requests
    that change state must send the `X-CSRF-Token` header, whose value is in
    the `sm_csrf` cookie.
servers:
  - url: /api/v1
tags:
  - name: System
  - name: Auth
  - name: Profile
  - name: Users
    description: Instance user administration (instance admins only).
  - name: Organizations
  - name: Members
  - name: Invitations
  - name: Projects
  - name: Audit
  - name: Database
    description: SQL on a project's database, and saved snippets.
paths:
  # ---------------------------------------------------------------- System
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Report service and database health
      security: []
      responses:
        "200":
          description: Supermixer and its database are reachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: The database is unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        default: { $ref: "#/components/responses/Error" }
  /ui-config:
    get:
      operationId: getUiConfig
      tags: [System]
      summary: Settings the web UI needs before sign-in
      security: []
      responses:
        "200":
          description: UI configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UiConfig" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ Auth
  /auth/sign-in:
    post:
      operationId: signIn
      tags: [Auth]
      summary: Sign in with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignInRequest" }
      responses:
        "200":
          description: Signed in; session cookies are set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /auth/sign-out:
    post:
      operationId: signOut
      tags: [Auth]
      summary: End the current session
      responses:
        "204": { description: Signed out; cookies cleared. }
        default: { $ref: "#/components/responses/Error" }

  # --------------------------------------------------------------- Profile
  /profile:
    get:
      operationId: getProfile
      tags: [Profile]
      summary: The signed-in user
      responses:
        "200":
          description: Profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateProfile
      tags: [Profile]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdate" }
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        default: { $ref: "#/components/responses/Error" }
  /profile/password:
    post:
      operationId: changePassword
      tags: [Profile]
      summary: Change your password; other sessions are signed out
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204": { description: Password changed. }
        default: { $ref: "#/components/responses/Error" }
  /profile/sessions:
    get:
      operationId: listSessions
      tags: [Profile]
      responses:
        "200":
          description: Active sessions, most recent first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }
        default: { $ref: "#/components/responses/Error" }
  /profile/sessions/{session_id}:
    delete:
      operationId: revokeSession
      tags: [Profile]
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Session revoked. }
        default: { $ref: "#/components/responses/Error" }
  /profile/permissions:
    get:
      operationId: getPermissions
      tags: [Profile]
      summary: Your role and permissions in every organization and project you can see
      responses:
        "200":
          description: Permissions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrganizationPermissions" }
        default: { $ref: "#/components/responses/Error" }

  # ----------------------------------------------------------------- Users
  /admin/users:
    get:
      operationId: listUsers
      tags: [Users]
      responses:
        "200":
          description: All users.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createUser
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
  /admin/users/{user_id}:
    patch:
      operationId: updateUser
      tags: [Users]
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
  /admin/users/{user_id}/sessions:
    delete:
      operationId: revokeUserSessions
      tags: [Users]
      summary: Sign the user out everywhere
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Signed out. }
        default: { $ref: "#/components/responses/Error" }
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [Users]
      summary: The instance at a glance, for instance admins
      responses:
        "200":
          description: Counts and settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
        default: { $ref: "#/components/responses/Error" }
  /admin/audit-logs:
    get:
      operationId: listInstanceAuditLogs
      tags: [Audit]
      summary: Audit entries outside any organization (accounts and sign-ins), for instance admins
      parameters:
        - { name: action, in: query, required: false, description: "Action prefix, e.g. user.", schema: { type: string } }
        - { name: before, in: query, required: false, description: Cursor from next_before, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Entries, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogPage" }
        default: { $ref: "#/components/responses/Error" }
  /admin/users/{user_id}/password:
    post:
      operationId: resetUserPassword
      tags: [Users]
      summary: Set a new password and sign the user out everywhere
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordReset" }
      responses:
        "204": { description: Password reset. }
        default: { $ref: "#/components/responses/Error" }

  # --------------------------------------------------------- Organizations
  /organizations:
    get:
      operationId: listOrganizations
      tags: [Organizations]
      responses:
        "200":
          description: Organizations you belong to.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Organization" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createOrganization
      tags: [Organizations]
      summary: Create an organization; you become its Owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        default: { $ref: "#/components/responses/Error" }
  /organizations/{slug}:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
    get:
      operationId: getOrganization
      tags: [Organizations]
      responses:
        "200":
          description: Organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateOrganization
      tags: [Organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteOrganization
      tags: [Organizations]
      summary: Delete an organization (it must have no projects)
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- Members
  /organizations/{slug}/members:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
    get:
      operationId: listMembers
      tags: [Members]
      responses:
        "200":
          description: Members.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        default: { $ref: "#/components/responses/Error" }
  /organizations/{slug}/members/{user_id}:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateMember
      tags: [Members]
      summary: Change a member's organization role and project-scoped roles
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeMember
      tags: [Members]
      summary: Remove a member, or leave the organization when it is you
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------ Invitations
  /organizations/{slug}/invitations:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
    get:
      operationId: listInvitations
      tags: [Invitations]
      responses:
        "200":
          description: Pending invitations.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invitation" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createInvitation
      tags: [Invitations]
      summary: Create an invitation link (valid 7 days)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationCreate" }
      responses:
        "201":
          description: Created. The token is only returned here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationCreated" }
        default: { $ref: "#/components/responses/Error" }
  /organizations/{slug}/invitations/{invitation_id}:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
      - { name: invitation_id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: revokeInvitation
      tags: [Invitations]
      responses:
        "204": { description: Revoked. }
        default: { $ref: "#/components/responses/Error" }
  /invitations/{token}:
    parameters:
      - { $ref: "#/components/parameters/InvitationToken" }
    get:
      operationId: getInvitation
      tags: [Invitations]
      summary: What an invitation link is for (no sign-in needed)
      security: []
      responses:
        "200":
          description: Invitation details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationPreview" }
        default: { $ref: "#/components/responses/Error" }
  /invitations/{token}/accept:
    parameters:
      - { $ref: "#/components/parameters/InvitationToken" }
    post:
      operationId: acceptInvitation
      tags: [Invitations]
      summary: Join the organization as the signed-in user
      responses:
        "200":
          description: Joined.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        default: { $ref: "#/components/responses/Error" }
  /invitations/{token}/sign-up:
    parameters:
      - { $ref: "#/components/parameters/InvitationToken" }
    post:
      operationId: signUpWithInvitation
      tags: [Invitations]
      summary: Create an account from an invitation and join; signs you in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationSignUp" }
      responses:
        "201":
          description: Account created and session cookies set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        default: { $ref: "#/components/responses/Error" }

  # --------------------------------------------------------------- Projects
  /projects:
    get:
      operationId: listProjects
      tags: [Projects]
      summary: Projects you can see, across organizations
      parameters:
        - { name: organization_slug, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Projects.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
  /organizations/{slug}/projects:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
    post:
      operationId: createProject
      tags: [Projects]
      summary: Register an existing self-hosted Supabase stack as a project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCreate" }
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
  /organizations/{slug}/projects/new-stack:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
    post:
      operationId: createStack
      tags: [Projects]
      summary: Create a new self-hosted Supabase stack and add it as a project
      description: |
        Needs provisioning.enabled. The project is created at once with stack
        status provisioning; the stack starts in the background (image
        downloads can take minutes). Follow it with GET /projects/{ref}/stack.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 64 }
      responses:
        "202":
          description: Created; the stack is starting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
  /organizations/{slug}/projects/test-connection:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
    post:
      operationId: testConnection
      tags: [Projects]
      summary: Check connection details before registering a project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectConnection" }
      responses:
        "200":
          description: Results of each check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: getProject
      tags: [Projects]
      responses:
        "200":
          description: Project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateProject
      tags: [Projects]
      summary: Rename a project or update its connection details
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProject
      tags: [Projects]
      summary: Unregister a project. The Supabase stack itself is untouched.
      responses:
        "204": { description: Unregistered. }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/transfer:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    post:
      operationId: transferProject
      tags: [Projects]
      summary: Move a project to another organization you own
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectTransfer" }
      responses:
        "200":
          description: Moved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/health:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: getProjectHealth
      tags: [Projects]
      responses:
        "200":
          description: Health of each service (cached for 15 seconds).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/stack:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: getStack
      tags: [Projects]
      summary: A created stack's status, containers and recent output
      responses:
        "200":
          description: The stack.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StackDetail" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/stack/{action}:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
      - name: action
        in: path
        required: true
        schema: { type: string, enum: [start, stop, restart] }
    post:
      operationId: stackAction
      tags: [Projects]
      summary: Start (or retry), stop (pause) or restart a created stack
      description: Runs in the background; follow it with GET /projects/{ref}/stack.
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StackDetail" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/functions:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: listEdgeFunctions
      tags: [Edge Functions]
      summary: The Edge Functions of a stack Supermixer created
      responses:
        "200":
          description: Functions, by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EdgeFunction" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/functions/{name}:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      operationId: getEdgeFunction
      tags: [Edge Functions]
      summary: A function and its files
      responses:
        "200":
          description: The function.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeFunctionDetail" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: deployEdgeFunction
      tags: [Edge Functions]
      summary: Create or replace a function, then restart the functions service
      description: |
        The function's folder is replaced by these files, plus the existing
        files listed in keep (ones that can't be edited as text). If the
        stack is running, its functions service is recreated so the change
        takes effect; otherwise it does when the stack next starts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { $ref: "#/components/schemas/EdgeFunctionFile" }
                keep:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Deployed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeFunctionChange" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteEdgeFunction
      tags: [Edge Functions]
      summary: Delete a function
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeFunctionChange" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/functions/{name}/versions:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      operationId: listFunctionVersions
      tags: [Edge Functions]
      summary: A function's kept versions, newest first
      description: The last 10 deploys of a function, kept even after it's deleted, with each file's SHA-256.
      responses:
        "200":
          description: The versions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FunctionVersion" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/functions/{name}/versions/{id}:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getFunctionVersion
      tags: [Edge Functions]
      summary: A kept version and its files
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FunctionVersionDetail" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/functions/{name}/versions/{id}/restore:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: restoreFunctionVersion
      tags: [Edge Functions]
      summary: Deploy a kept version again
      responses:
        "200":
          description: Restored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeFunctionChange" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/rotation-advisories:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: listRotationAdvisories
      tags: [Projects]
      summary: People who could read this project's keys and lost that access
      description: |
        They may still have the keys, so the project's keys should be rotated. The list is cleared
        by rotating the secret key and the JWT secret together (stacks Supermixer created), or by
        dismissing it.
      responses:
        "200":
          description: The advisories, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RotationAdvisory" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: dismissRotationAdvisories
      tags: [Projects]
      summary: Dismiss the advisories (after rotating the keys where the stack runs)
      responses:
        "204": { description: Dismissed. }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/advisors/snapshots:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: listDBSnapshots
      tags: [Advisors]
      summary: Snapshots of the database's objects, newest first
      description: |
        Fingerprints of the objects that could keep someone in: roles, SECURITY DEFINER functions,
        triggers, event triggers, cron jobs and Auth users' passwords and roles. Taken before each
        function deploy and on demand; the newest 20 are kept.
      responses:
        "200":
          description: The snapshots.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DBSnapshot" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createDBSnapshot
      tags: [Advisors]
      summary: Take a snapshot now, to compare with later
      responses:
        "201":
          description: Taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DBSnapshot" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/advisors/changes:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
      - name: since
        in: query
        description: The snapshot to compare with; the newest if left out.
        schema: { type: string, format: uuid }
    get:
      operationId: getDBChanges
      tags: [Advisors]
      summary: What changed in the database since a snapshot
      responses:
        "200":
          description: The changes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DBChanges" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/stack/upgrade:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: getStackUpgrade
      tags: [Projects]
      summary: What upgrading the stack to the Supabase version Supermixer bundles would change
      responses:
        "200":
          description: The upgrade.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StackUpgrade" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: upgradeStack
      tags: [Projects]
      summary: Upgrade the stack to the Supabase version Supermixer bundles
      description: |
        Backs the database up, renders the stack's files from the new version (its .env and Edge
        Functions kept), pulls the new images and recreates the services that changed. If the stack
        doesn't come up, it goes back to its previous files and images. Runs in the background.
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StackDetail" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/stack/rotate-keys:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    post:
      operationId: rotateStackKeys
      tags: [Projects]
      summary: Replace some of a created stack's keys
      description: |
        Writes new values to the stack's .env and Supermixer's copy, then (if the stack runs) recreates
        the services that use them. Old values stop working at once, except the previous signing key,
        which still verifies sessions it signed until the next rotation. Runs in the background.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keys]
              properties:
                keys:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [secret_key, publishable_key, signing_key, jwt_secret, functions_db_password]
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StackDetail" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/log-drains:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: listLogDrains
      tags: [Projects]
      summary: Where a created stack's logs are also sent
      responses:
        "200":
          description: The drains; secrets are never returned.
          content:
            application/json:
              schema:
                type: object
                required: [drains]
                properties:
                  drains:
                    type: array
                    items: { $ref: "#/components/schemas/LogDrain" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createLogDrain
      tags: [Projects]
      summary: Add a log drain
      description: Vector checks the new configuration first, then restarts with it if the stack runs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogDrainInput" }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogDrain" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/log-drains/{id}:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateLogDrain
      tags: [Projects]
      summary: Change a log drain
      description: Header values and the API key are kept when left out.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogDrainInput" }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogDrain" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteLogDrain
      tags: [Projects]
      summary: Remove a log drain
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/backups:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: listBackups
      tags: [Backups]
      summary: Database backups of a stack Supermixer created, newest first
      responses:
        "200":
          description: Backups, and the schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createBackup
      tags: [Backups]
      summary: Back the database up now
      description: Runs in the background; poll the list. Needs project settings access.
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/backups/{id}:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteBackup
      tags: [Backups]
      summary: Delete a backup and its files, in the bucket too
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/backups/{id}/upload:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: retryBackupUpload
      tags: [Backups]
      summary: Try copying a backup to the bucket again now
      description: After a failed upload, Supermixer tries again on its own, waiting longer each time (an hour at most).
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/backups/{id}/files/{file}:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - name: file
        in: path
        required: true
        schema: { type: string, enum: [roles.sql, schema.sql, data.sql] }
    get:
      operationId: downloadBackupFile
      tags: [Backups]
      summary: Download one of a backup's dumps
      description: |
        The data dump holds every row, Auth's users included, so this needs project settings
        access and is recorded in the audit log. Restore elsewhere as Supabase documents:
        psql --single-transaction -v ON_ERROR_STOP=1 -f roles.sql -f schema.sql -f data.sql.
      responses:
        "200":
          description: The SQL.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/backups/{id}/restore:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: restoreBackup
      tags: [Backups]
      summary: Restore a backup into this project
      description: |
        Takes a backup of the current database first, then starts a fresh database and replays the
        backup into it. The project is offline meanwhile, and changes since the backup are lost. If the
        restore fails, the project goes back to its previous database. Runs in the background.
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StackDetail" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/backups/{id}/restore-to-new:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: restoreBackupToNewProject
      tags: [Backups]
      summary: Create a new project from a backup
      description: A new stack in the same organization, with its own keys, started and then restored from the backup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "202":
          description: Creating.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/auth-config:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: getAuthConfig
      tags: [Auth]
      summary: Auth settings of a stack Supermixer created
      description: |
        Named as in Supabase's Management API (/v1/projects/{ref}/config/auth). A value is null when
        it's left to Auth's default. Secrets are never returned; secrets_set names those that are set.
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateAuthConfig
      tags: [Auth]
      summary: Change Auth settings, then restart the auth service
      description: |
        Only the given settings change; null puts one back to its default. Needs project settings
        access (Owners and Administrators), and is recorded in the audit log (names only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/function-settings:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: getFunctionSettings
      tags: [Edge Functions]
      summary: How a created stack's Edge Functions reach its database
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FunctionSettings" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setFunctionSettings
      tags: [Edge Functions]
      summary: Change what Edge Functions can reach, then restart the functions service
      description: Needs project settings access (Owners and Administrators). Recorded in the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FunctionSettingsUpdate" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/FunctionSettings" }
                  - type: object
                    required: [restarted]
                    properties:
                      restarted: { type: boolean }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/function-secrets:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: listFunctionSecrets
      tags: [Edge Functions]
      summary: The names of a stack's Edge Function secrets, with digests of their values
      responses:
        "200":
          description: Secrets, by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FunctionSecret" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setFunctionSecrets
      tags: [Edge Functions]
      summary: Add or change secrets, then restart the functions service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secrets]
              properties:
                secrets:
                  type: array
                  items:
                    type: object
                    required: [name, value]
                    properties:
                      name: { type: string }
                      value: { type: string }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FunctionSecretsChange" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteFunctionSecrets
      tags: [Edge Functions]
      summary: Remove secrets, then restart the functions service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [names]
              properties:
                names:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FunctionSecretsChange" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/studio-login:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    post:
      operationId: revealStudioLogin
      tags: [Projects]
      summary: The user name and password of a created stack's Studio
      description: |
        Studio is served by the stack's API gateway behind basic auth, with
        credentials Supermixer generated. Needs the same access as revealing
        secret API keys, and is recorded in the audit log.
      responses:
        "200":
          description: The login.
          content:
            application/json:
              schema:
                type: object
                required: [username, password]
                properties:
                  username: { type: string }
                  password: { type: string }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/advisors/lints:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: listLints
      tags: [Projects]
      summary: Run Supabase's database linter (splinter) on the project's database.
      description: |
        The checks behind the Security and Performance Advisors. They run in a
        read-only transaction as the project's admin user.
      responses:
        "200":
          description: Findings, most severe first.
          content:
            application/json:
              schema:
                type: object
                required: [lints, ran_at]
                properties:
                  lints:
                    type: array
                    items: { $ref: "#/components/schemas/Lint" }
                  ran_at: { type: string, format: date-time }
        "422":
          description: The linter failed on this database.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryError" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/logs:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: listLogs
      tags: [Projects]
      summary: Log entries from the stack's log analytics (Logflare), newest first.
      description: |
        Read from the log tables Logflare keeps in the stack's _supabase
        database, in a read-only transaction. Only log tables are reachable.
      parameters:
        - { name: source, in: query, required: true, schema: { $ref: "#/components/schemas/LogSource" } }
        - { name: search, in: query, required: false, description: Words the message must all contain, in any order, schema: { type: string, maxLength: 200 } }
        - { name: since, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: before, in: query, required: false, description: Only entries older than this (paging), schema: { type: string, format: date-time } }
        - { name: before_id, in: query, required: false, description: "With before: the last entry already shown, so entries sharing its timestamp aren't skipped", schema: { type: string, maxLength: 64 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Entries, or available false when the stack doesn't run log analytics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogPage" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/logs/requests:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: getRequestStats
      tags: [Projects]
      summary: API gateway requests since a time, by hour, status and path.
      parameters:
        - { name: since, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Request counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestStats" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/api-keys:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: listApiKeys
      tags: [Projects]
      summary: The project's API keys. Secret values only with reveal=true.
      parameters:
        - { name: reveal, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Keys.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiKey" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ Audit
  /organizations/{slug}/audit-logs:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
    get:
      operationId: listAuditLogs
      tags: [Audit]
      parameters:
        - { name: action, in: query, required: false, description: Action prefix, e.g. "project." , schema: { type: string } }
        - { name: actor_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: since, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: before, in: query, required: false, description: Cursor from next_before, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Entries, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogPage" }
        default: { $ref: "#/components/responses/Error" }

  /projects/{ref}/read-only-user:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    post:
      operationId: createReadOnlyUser
      tags: [Projects]
      summary: Create a read-only database login for Read-only members' queries.
      description: |
        Creates a LOGIN role with pg_read_all_data (and BYPASSRLS, like
        Supabase's own read-only user) on the project's database, tests it and
        stores its password encrypted. Read-only queries then run as that user,
        which cannot write, change role or signal other connections.
      responses:
        "200":
          description: The project, now with database.read_only_user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteReadOnlyUser
      tags: [Projects]
      summary: Drop the read-only login; read-only queries go back to a read-only transaction.
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ SQL
  /projects/{ref}/query:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    post:
      operationId: runQuery
      tags: [Database]
      summary: Run SQL on the project's database.
      description: |
        Members without data write access run one statement at a time, in a
        read-only transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueryRequest" }
      responses:
        "200":
          description: One result per statement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryResponse" }
        "422":
          description: Postgres rejected the SQL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryError" }
        default: { $ref: "#/components/responses/Error" }

  /projects/{ref}/snippets:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: listSnippets
      tags: [Database]
      summary: Your snippets and the ones shared with the project.
      responses:
        "200":
          description: Snippets, most recently updated first (without content).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Snippet" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createSnippet
      tags: [Database]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SnippetCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snippet" }
        default: { $ref: "#/components/responses/Error" }

  /projects/{ref}/snippets/{snippet_id}:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
      - { name: snippet_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSnippet
      tags: [Database]
      responses:
        "200":
          description: The snippet with its content.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snippet" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateSnippet
      tags: [Database]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SnippetUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snippet" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSnippet
      tags: [Database]
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Error" }

components:
  parameters:
    Slug: { name: slug, in: path, required: true, schema: { type: string } }
    Ref: { name: ref, in: path, required: true, schema: { type: string } }
    InvitationToken: { name: token, in: path, required: true, schema: { type: string } }
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    QueryRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, maxLength: 1000000 }
        params:
          type: array
          description: Text values for $1, $2, …; only one statement is allowed with params.
          items: { type: string, nullable: true }
        read_only: { type: boolean, default: false, description: Run read-only even if you may write. }
        max_rows: { type: integer, minimum: 1, maximum: 10000, description: "Rows to return; defaults to projects.query_max_rows." }
    QueryColumn:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, description: "Postgres type name, or its OID when unknown." }
    QueryResult:
      type: object
      required: [command, row_count, columns, rows, truncated]
      properties:
        command: { type: string, example: SELECT }
        row_count: { type: integer, format: int64 }
        columns:
          type: array
          items: { $ref: "#/components/schemas/QueryColumn" }
        rows:
          type: array
          items:
            type: array
            items: {}
        truncated: { type: boolean, description: More rows matched than max_rows. }
        notices:
          type: array
          items: { type: string }
    QueryResponse:
      type: object
      required: [results, read_only, duration_ms]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/QueryResult" }
        read_only: { type: boolean }
        duration_ms: { type: integer, format: int64 }
    QueryError:
      type: object
      required: [message]
      properties:
        message: { type: string }
        code: { type: string, description: SQLSTATE }
        detail: { type: string }
        hint: { type: string }
        position: { type: integer, description: 1-based character offset in the query. }
    SnippetVisibility:
      type: string
      enum: [private, project]
    Snippet:
      type: object
      required: [id, name, visibility, owner_id, owner_username, created_at, updated_at, can_edit]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        content: { type: string, description: Only on single-snippet responses. }
        visibility: { $ref: "#/components/schemas/SnippetVisibility" }
        favorite: { type: boolean }
        owner_id: { type: string, format: uuid }
        owner_username: { type: string }
        can_edit: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SnippetCreate:
      type: object
      required: [name, content]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        content: { type: string, maxLength: 1000000 }
        visibility: { $ref: "#/components/schemas/SnippetVisibility" }
    SnippetUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        content: { type: string, maxLength: 1000000 }
        visibility: { $ref: "#/components/schemas/SnippetVisibility" }
        favorite: { type: boolean }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        code:
          type: string
          description: "Set for errors a client handles specially: password_change_required (403) means the account must choose a new password first."
    OrgRole:
      type: string
      enum: [owner, administrator, developer, read_only, no_access]
    ProjectRole:
      type: string
      enum: [administrator, developer, read_only]

    Health:
      type: object
      required: [status, version, database]
      properties:
        status: { type: string, enum: [healthy, unhealthy] }
        version: { type: string }
        database:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [healthy, unhealthy] }
            schema_version: { type: integer, format: int64 }
            installed_at: { type: string, format: date-time }
            error: { type: string }
    UiConfig:
      type: object
      required: [app_name, version, brand_color, default_theme, provisioning]
      properties:
        app_name: { type: string }
        version: { type: string }
        brand_color: { type: string, description: "appearance.brand_color as #rrggbb" }
        default_theme: { type: string, enum: [dark, light, system] }
        provisioning:
          type: object
          required: [enabled, template]
          description: Whether this server can create stacks, and from which supabase/docker commit.
          properties:
            enabled: { type: boolean }
            template: { type: string }

    StackStatus:
      type: string
      enum: [provisioning, running, paused, failed, deleting]
    Stack:
      type: object
      required: [status, error, template]
      description: Set on projects Supermixer created; null for connected ones.
      properties:
        status: { $ref: "#/components/schemas/StackStatus" }
        error: { type: string, description: "What went wrong, when status is failed." }
        status_at: { type: string, format: date-time, nullable: true }
        template: { type: string, description: The supabase/supabase commit the stack was made from. }
        operation:
          type: string
          enum: [starting, stopping, restarting, deleting, updating, backing_up, restoring, upgrading, rotating_keys]
          nullable: true
          description: What Supermixer is doing to the stack right now.
    EdgeFunction:
      type: object
      required: [name, url, updated_at, files, size, entrypoint]
      properties:
        name: { type: string }
        url: { type: string, description: "Where it's invoked, through the stack's API gateway." }
        updated_at: { type: string, format: date-time }
        files: { type: integer }
        size: { type: integer, description: "Bytes, all files together." }
        entrypoint: { type: string, nullable: true, description: The file it starts from; null if it has none. }
    EdgeFunctionFile:
      type: object
      required: [path, content]
      properties:
        path: { type: string, description: "Relative, with /: index.ts, lib/db.ts" }
        content: { type: string }
    EdgeFunctionDetail:
      type: object
      required: [function, files, other_files, sha256]
      properties:
        function: { $ref: "#/components/schemas/EdgeFunction" }
        sha256: { type: string, description: "The deployed files' hash, as a version's (FunctionVersion.sha256)." }
        files:
          type: array
          items: { $ref: "#/components/schemas/EdgeFunctionFile" }
        other_files:
          type: array
          items: { type: string }
          description: Files that can't be edited as text (binary, over 1 MiB, links). Pass them as keep to deploy without removing them.
    EdgeFunctionChange:
      type: object
      required: [restarted]
      properties:
        function: { $ref: "#/components/schemas/EdgeFunction" }
        restarted: { type: boolean, description: Whether the functions service was recreated; false while the stack isn't running. }
        version: { $ref: "#/components/schemas/FunctionVersion" }
    DBSnapshot:
      type: object
      required: [id, taken_at, reason, detail, taken_by]
      properties:
        id: { type: string, format: uuid }
        taken_at: { type: string, format: date-time }
        reason: { type: string, enum: [manual, function_deploy] }
        detail: { type: string, description: "For function_deploy, the function's name." }
        taken_by: { type: string }
    DBChange:
      type: object
      required: [key]
      properties:
        key: { type: string }
        label: { type: string, description: "For Auth users, their email or phone now." }
        before: { description: The fingerprint in the snapshot. }
        after: { description: The fingerprint now. }
    DBChanges:
      type: object
      required: [since, checked_at, superuser, categories]
      properties:
        since: { $ref: "#/components/schemas/DBSnapshot" }
        checked_at: { type: string, format: date-time }
        superuser:
          type: boolean
          description: "Whether the database was read as a superuser: role passwords and every role's cron jobs are covered then."
        categories:
          type: array
          items:
            type: object
            required: [name, label, added, removed, changed]
            properties:
              name: { type: string }
              label: { type: string }
              skipped: { type: string, description: Why it couldn't be compared. }
              added:
                type: array
                items: { $ref: "#/components/schemas/DBChange" }
              removed:
                type: array
                items: { $ref: "#/components/schemas/DBChange" }
              changed:
                type: array
                items: { $ref: "#/components/schemas/DBChange" }
    RotationAdvisory:
      type: object
      required: [username, reason, created_at]
      properties:
        username: { type: string }
        reason: { type: string, enum: [removed, left, role_changed, disabled, transferred] }
        created_at: { type: string, format: date-time }
    FunctionVersion:
      type: object
      required: [id, kind, created_at, sha256, files, size]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [deployed, restored, found]
          description: "found: the function as Supermixer found it before changing it, deployed before versions were kept or changed outside Supermixer."
        created_at: { type: string, format: date-time }
        created_by: { type: string, description: "Who deployed or restored it." }
        restored_from: { type: string, description: The version a restored one copies. }
        sha256: { type: string, description: "The whole function's hash: SHA-256 of its files' paths and hashes." }
        size: { type: integer, format: int64 }
        files:
          type: array
          items:
            type: object
            required: [path, sha256, size]
            properties:
              path: { type: string }
              sha256: { type: string }
              size: { type: integer, format: int64 }
              link: { type: string, description: "A symbolic link's target (its hash is of the target)." }
              unreadable: { type: boolean, description: "A file Supermixer couldn't read (one a container's user wrote): listed, but not hashed or kept." }
    FunctionVersionDetail:
      type: object
      required: [version, files, other_files]
      properties:
        version: { $ref: "#/components/schemas/FunctionVersion" }
        files:
          type: array
          items: { $ref: "#/components/schemas/EdgeFunctionFile" }
        other_files:
          type: array
          items: { type: string }
          description: Files that can't be shown as text.
    LogDrain:
      type: object
      required: [id, name, type, enabled, url, headers, gzip, datadog_site, api_key_set]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [http, loki, datadog] }
        enabled: { type: boolean }
        url: { type: string, description: "The HTTP endpoint, or Loki's base URL." }
        headers:
          type: array
          items:
            type: object
            required: [name, value_set]
            properties:
              name: { type: string }
              value_set: { type: boolean }
        gzip: { type: boolean }
        datadog_site: { type: string }
        api_key_set: { type: boolean }
    LogDrainInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, enum: [http, loki, datadog] }
        enabled: { type: boolean, default: true }
        url: { type: string }
        headers:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              value: { type: string, description: Left out to keep the current value. }
        gzip: { type: boolean }
        datadog_site: { type: string }
        api_key: { type: string, description: Left out (or empty) to keep the current key. }
    StackUpgrade:
      type: object
      required: [current, latest, up_to_date, images, new_keys]
      properties:
        current: { type: string, description: The supabase/supabase commit the stack's files come from. }
        latest: { type: string, description: The commit Supermixer bundles. }
        up_to_date: { type: boolean }
        images:
          type: array
          description: Services whose image changes. from is empty for a new service, to for a removed one.
          items:
            type: object
            required: [service, from, to]
            properties:
              service: { type: string }
              from: { type: string }
              to: { type: string }
        new_keys:
          type: array
          description: .env settings the new version adds (generated, or the template's defaults).
          items: { type: string }
        blocked: { type: string, description: "Why the upgrade can't run, if it can't." }
    Backup:
      type: object
      required: [id, kind, status, error, size_bytes, template, postgres_version, started_at, local, upload_error]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [scheduled, manual, pre_restore, pre_upgrade] }
        status: { type: string, enum: [running, completed, failed] }
        error: { type: string }
        size_bytes: { type: integer, format: int64, description: Compressed. }
        template: { type: string }
        postgres_version: { type: string }
        created_by: { type: string, nullable: true, description: "Username, for manual backups." }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        local: { type: boolean, description: "Whether the files are on Supermixer's disk (backups_dir)." }
        remote:
          type: string
          nullable: true
          description: "The copy in a bucket, as s3://bucket/key, once uploaded."
        upload_error: { type: string, description: "Why the last upload to the bucket failed; empty if it didn't." }
    BackupList:
      type: object
      required: [backups, interval_hours, keep]
      properties:
        backups:
          type: array
          items: { $ref: "#/components/schemas/Backup" }
        interval_hours: { type: number, description: How often scheduled backups run; 0 when they're off. }
        keep: { type: integer, description: Scheduled backups kept. }
        s3:
          type: object
          nullable: true
          description: The bucket backups are copied to, if one is set up.
          required: [location, endpoint, keep_local]
          properties:
            location: { type: string, description: "s3://bucket/prefix/<ref>" }
            endpoint: { type: string }
            keep_local: { type: boolean, description: "Whether backups stay in backups_dir after they're copied." }
    AuthConfig:
      type: object
      required: [values, secrets_set, callback_url]
      properties:
        values:
          type: object
          additionalProperties: true
          description: Setting name → true/false, a number, text, or null (Auth's default).
        secrets_set:
          type: array
          items: { type: string }
        callback_url: { type: string, description: The redirect URL to register with OAuth providers. }
        restarted: { type: boolean, description: "After a change, whether the auth service was recreated." }
    FunctionSettings:
      type: object
      required: [database_access, admin_access]
      properties:
        database_access:
          type: string
          enum: [service_role, postgres]
          description: |
            The login in SUPABASE_DB_URL. service_role: functions_user, whose sessions act as
            service_role (the same access as the service-role key). postgres: the stack's postgres
            login, which can also create roles and change Auth's and Realtime's tables.
        admin_access:
          type: boolean
          description: |
            Whether functions get SUPABASE_SERVICE_ROLE_KEY, SUPABASE_SECRET_KEYS and SUPABASE_DB_URL
            (the default). Without them a function acts as its caller, with the caller's token and
            the publishable or anon key: deployed code can't bypass Row Level Security, but
            functions that use admin APIs or the database URL stop working.
    FunctionSettingsUpdate:
      type: object
      properties:
        database_access: { type: string, enum: [service_role, postgres] }
        admin_access: { type: boolean }
    FunctionSecret:
      type: object
      required: [name, digest]
      properties:
        name: { type: string }
        digest: { type: string, description: "The value's SHA-256, in hex." }
    FunctionSecretsChange:
      type: object
      required: [secrets, restarted]
      properties:
        secrets:
          type: array
          items: { $ref: "#/components/schemas/FunctionSecret" }
        restarted: { type: boolean }
    StackDetail:
      allOf:
        - { $ref: "#/components/schemas/Stack" }
        - type: object
          required: [ports, services, log]
          properties:
            ports:
              type: object
              required: [api, db, pooler]
              properties:
                api: { type: integer }
                db: { type: integer }
                pooler: { type: integer }
            services:
              type: array
              nullable: true
              description: The stack's containers; null when Docker couldn't be asked.
              items:
                type: object
                required: [service, state, health, status]
                properties:
                  service: { type: string }
                  state: { type: string }
                  health: { type: string }
                  status: { type: string }
            services_error: { type: string, nullable: true }
            log: { type: string, description: The end of Supermixer's log of docker compose output for this stack. }

    SignInRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    Profile:
      type: object
      required: [id, username, display_name, is_instance_admin, default_password, password_change_required, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, nullable: true }
        display_name: { type: string }
        is_instance_admin: { type: boolean }
        default_password:
          type: boolean
          description: Still using the well-known bootstrap password.
        password_change_required:
          type: boolean
          description: "Must choose a new password before anything else; until then the API only allows the profile, changing the password and signing out."
        theme:
          allOf: [{ $ref: "#/components/schemas/ThemePreference" }]
          nullable: true
          description: The theme the user chose; null if they haven't, and the instance default applies.
        created_at: { type: string, format: date-time }
    ThemePreference:
      type: string
      enum: [dark, light, system]
    ProfileUpdate:
      type: object
      properties:
        display_name: { type: string, maxLength: 64 }
        email: { type: string, nullable: true }
        theme: { $ref: "#/components/schemas/ThemePreference" }
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string }
    PasswordReset:
      type: object
      required: [password]
      properties:
        password: { type: string }
        require_password_change: { type: boolean, default: true, description: "They choose their own password at next sign-in (not for your own account)." }
    AdminOverview:
      type: object
      required: [version, users, active_users, instance_admins, password_change_required, organizations, projects, managed_projects, provisioning, backups]
      properties:
        version: { type: string }
        users: { type: integer }
        active_users: { type: integer }
        instance_admins: { type: integer, description: Active ones. }
        password_change_required: { type: integer, description: Active accounts that must still choose a new password. }
        organizations: { type: integer }
        projects: { type: integer }
        managed_projects: { type: integer, description: Projects whose stacks Supermixer created. }
        provisioning:
          type: object
          required: [enabled, stacks_dir, public_host]
          properties:
            enabled: { type: boolean }
            stacks_dir: { type: string }
            public_host: { type: string }
        backups:
          type: object
          required: [dir, interval_hours, keep]
          properties:
            dir: { type: string }
            interval_hours: { type: number }
            keep: { type: integer }
            s3: { type: string, nullable: true, description: "s3://bucket/prefix, if backups are copied to a bucket." }
    Session:
      type: object
      required: [id, created_at, last_seen_at, expires_at, ip, user_agent, current]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        ip: { type: string }
        user_agent: { type: string }
        current: { type: boolean }
    OrganizationPermissions:
      type: object
      required: [organization_slug, role, permissions, projects]
      properties:
        organization_slug: { type: string }
        role: { $ref: "#/components/schemas/OrgRole" }
        permissions: { type: array, items: { type: string } }
        projects:
          type: array
          items: { $ref: "#/components/schemas/ProjectPermissions" }
    ProjectPermissions:
      type: object
      required: [ref, role, permissions]
      properties:
        ref: { type: string }
        role: { $ref: "#/components/schemas/OrgRole" }
        permissions: { type: array, items: { type: string } }

    User:
      type: object
      required: [id, username, display_name, is_instance_admin, default_password, password_change_required, disabled, sessions, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, nullable: true }
        display_name: { type: string }
        is_instance_admin: { type: boolean }
        default_password: { type: boolean }
        password_change_required: { type: boolean }
        disabled: { type: boolean }
        sessions: { type: integer, description: Signed-in sessions. }
        last_seen_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    UserCreate:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
        email: { type: string, nullable: true }
        display_name: { type: string }
        is_instance_admin: { type: boolean, default: false }
        require_password_change: { type: boolean, default: true, description: "They choose their own password at first sign-in." }
    UserUpdate:
      type: object
      properties:
        email: { type: string, nullable: true }
        display_name: { type: string }
        is_instance_admin: { type: boolean }
        disabled: { type: boolean }
        password_change_required: { type: boolean, description: They must choose a new password at their next request. }

    Organization:
      type: object
      required: [id, slug, name, role, permissions, project_count, created_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/OrgRole" }
        permissions: { type: array, items: { type: string } }
        project_count: { type: integer }
        created_at: { type: string, format: date-time }
    OrganizationCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
    OrganizationUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string }

    MemberProjectRole:
      type: object
      required: [ref, name, role]
      properties:
        ref: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/ProjectRole" }
    Member:
      type: object
      required: [user_id, username, display_name, role, project_roles, joined_at]
      properties:
        user_id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        email: { type: string, nullable: true }
        role: { $ref: "#/components/schemas/OrgRole" }
        project_roles:
          type: array
          items: { $ref: "#/components/schemas/MemberProjectRole" }
        joined_at: { type: string, format: date-time }
    ProjectRoleAssignment:
      type: object
      required: [ref, role]
      properties:
        ref: { type: string }
        role: { $ref: "#/components/schemas/ProjectRole" }
    MemberUpdate:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/OrgRole" }
        project_roles:
          type: array
          description: Replaces all of the member's project-scoped roles in this organization.
          items: { $ref: "#/components/schemas/ProjectRoleAssignment" }

    Invitation:
      type: object
      required: [id, email, role, project_roles, invited_by, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/OrgRole" }
        project_roles:
          type: array
          items: { $ref: "#/components/schemas/MemberProjectRole" }
        invited_by: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    InvitationCreate:
      type: object
      required: [role]
      properties:
        email: { type: string, description: Who the link is for (informational). }
        role: { $ref: "#/components/schemas/OrgRole" }
        project_roles:
          type: array
          items: { $ref: "#/components/schemas/ProjectRoleAssignment" }
    InvitationCreated:
      allOf:
        - { $ref: "#/components/schemas/Invitation" }
        - type: object
          required: [token, url]
          properties:
            token: { type: string }
            url: { type: string, description: Link to share with the invitee. }
    InvitationPreview:
      type: object
      required: [organization_name, organization_slug, role, email, invited_by, expires_at, valid]
      properties:
        organization_name: { type: string }
        organization_slug: { type: string }
        role: { $ref: "#/components/schemas/OrgRole" }
        email: { type: string }
        invited_by: { type: string }
        expires_at: { type: string, format: date-time }
        valid: { type: boolean, description: False once accepted or expired. }
    InvitationSignUp:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
        display_name: { type: string }
        email: { type: string, nullable: true }

    DatabaseConnection:
      type: object
      required: [host, port, name, user, sslmode]
      properties:
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        name: { type: string }
        user: { type: string }
        password: { type: string, description: Write-only. Omit on update to keep the current one. }
        sslmode: { type: string, enum: [disable, prefer, require, verify-ca, verify-full] }
    ApiKeysInput:
      type: object
      description: Write-only. On update, omitted or empty keys keep their current value.
      properties:
        anon: { type: string }
        service_role: { type: string }
        publishable: { type: string }
        secret: { type: string }
        jwt_secret: { type: string }
    ProjectConnection:
      type: object
      required: [api_url, database, keys]
      properties:
        api_url: { type: string, description: "The stack's API gateway, e.g. http://localhost:8000" }
        studio_url: { type: string }
        database: { $ref: "#/components/schemas/DatabaseConnection" }
        keys: { $ref: "#/components/schemas/ApiKeysInput" }
    ProjectCreate:
      type: object
      required: [name, connection]
      properties:
        name: { type: string }
        connection: { $ref: "#/components/schemas/ProjectConnection" }
    ProjectUpdate:
      type: object
      properties:
        name: { type: string }
        connection: { $ref: "#/components/schemas/ProjectConnection" }
    ProjectTransfer:
      type: object
      required: [organization_slug]
      properties:
        organization_slug: { type: string }
    Project:
      type: object
      required: [id, ref, name, organization_slug, organization_name, api_url, studio_url, database, keys_present, role, permissions, created_at, updated_at, stack]
      properties:
        stack:
          allOf: [{ $ref: "#/components/schemas/Stack" }]
          nullable: true
        id: { type: string, format: uuid }
        ref: { type: string }
        name: { type: string }
        organization_slug: { type: string }
        organization_name: { type: string }
        api_url: { type: string }
        studio_url: { type: string }
        database:
          type: object
          required: [host, port, name, user, sslmode, uri]
          properties:
            host: { type: string }
            port: { type: integer }
            name: { type: string }
            user: { type: string }
            sslmode: { type: string }
            uri: { type: string, description: Connection string with a password placeholder. }
            read_only_user:
              type: string
              nullable: true
              description: Login that Read-only members' queries use, when one was created.
        keys_present:
          type: object
          required: [anon, service_role, publishable, secret, jwt_secret]
          properties:
            anon: { type: boolean }
            service_role: { type: boolean }
            publishable: { type: boolean }
            secret: { type: boolean }
            jwt_secret: { type: boolean }
        role: { $ref: "#/components/schemas/OrgRole" }
        permissions: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ServiceCheck:
      type: object
      required: [service, label, status, latency_ms]
      properties:
        service: { type: string, enum: [auth, rest, storage, meta, database] }
        label: { type: string }
        status: { type: string, enum: [ok, error] }
        latency_ms: { type: integer, format: int64 }
        detail: { type: string }
    HealthReport:
      type: object
      required: [status, services, checked_at]
      properties:
        status: { type: string, enum: [healthy, degraded, unhealthy] }
        services:
          type: array
          items: { $ref: "#/components/schemas/ServiceCheck" }
        postgres_version: { type: string }
        auth_version: { type: string }
        checked_at: { type: string, format: date-time }
        example_secrets:
          type: array
          items: { type: string }
          description: "From a connection test: the credentials given that are Supabase's public example values."
    LogSource:
      type: string
      enum: [api_gateway, auth, postgres, postgrest, pooler, storage, realtime, functions]
    LogEntry:
      type: object
      required: [id, timestamp, message, metadata]
      properties:
        id: { type: string }
        timestamp: { type: string, format: date-time }
        message: { type: string }
        metadata: { type: object, additionalProperties: true }
    LogPage:
      type: object
      required: [available, entries]
      properties:
        available: { type: boolean, description: Whether the stack runs log analytics. }
        entries:
          type: array
          items: { $ref: "#/components/schemas/LogEntry" }
    RequestStats:
      type: object
      required: [available, total, hours, statuses, paths]
      properties:
        available: { type: boolean }
        total: { type: integer, format: int64 }
        hours:
          type: array
          items:
            type: object
            required: [hour, count, errors]
            properties:
              hour: { type: string, format: date-time }
              count: { type: integer, format: int64 }
              errors: { type: integer, format: int64, description: Responses with status 400 or above. }
        statuses:
          type: array
          items:
            type: object
            required: [status, count]
            properties:
              status: { type: integer }
              count: { type: integer, format: int64 }
        paths:
          type: array
          description: The busiest paths, at most 20.
          items:
            type: object
            required: [method, path, count, errors]
            properties:
              method: { type: string }
              path: { type: string }
              count: { type: integer, format: int64 }
              errors: { type: integer, format: int64 }

    Lint:
      type: object
      required: [name, title, level, facing, categories, description, detail, remediation, metadata, cache_key]
      properties:
        name: { type: string, description: "The check, e.g. rls_disabled_in_public" }
        title: { type: string }
        level: { type: string, enum: [ERROR, WARN, INFO] }
        facing: { type: string, enum: [EXTERNAL, INTERNAL] }
        categories:
          type: array
          items: { type: string, enum: [SECURITY, PERFORMANCE] }
        description: { type: string }
        detail: { type: string, description: "What was found, in Markdown." }
        remediation: { type: string, description: Supabase's guide to fixing it. }
        metadata: { type: object, additionalProperties: true, description: "The object it's about: schema, name, type, …" }
        cache_key: { type: string }

    ApiKey:
      type: object
      required: [id, name, kind, secret, present, description]
      properties:
        id: { type: string, enum: [anon, service_role, publishable, secret, jwt_secret] }
        name: { type: string }
        kind: { type: string, enum: [legacy, api_key, jwt_secret] }
        secret: { type: boolean, description: Must never be exposed in a browser. }
        present: { type: boolean }
        value: { type: string, description: "Present for public keys, and for secret ones when revealed." }
        description: { type: string }

    AuditLogEntry:
      type: object
      required: [id, action, actor_username, target_type, target_id, target_name, metadata, ip, created_at]
      properties:
        id: { type: integer, format: int64 }
        action: { type: string }
        actor_id: { type: string, format: uuid, nullable: true }
        actor_username: { type: string }
        project_ref: { type: string, nullable: true }
        target_type: { type: string }
        target_id: { type: string }
        target_name: { type: string }
        metadata: { type: object, additionalProperties: true }
        ip: { type: string }
        created_at: { type: string, format: date-time }
    AuditLogPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AuditLogEntry" }
        next_before: { type: integer, format: int64, nullable: true }
