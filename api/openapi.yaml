openapi: 3.0.3
info:
  title: Supermixer API
  version: 0.3.0
  description: |
    Management API for Supermixer, an on-premise management plane for
    self-hosted Supabase. Resource paths follow the shape of the Supabase
    Management API (https://api.supabase.com/api/v1) where a concept exists in both.

    Authentication is either:

    - a personal access token (Account › Access Tokens) in
      `Authorization: Bearer sbp_…`, for scripts and CI. It acts as its
      owner, but can't change how the account is secured (password,
      two-factor sign-in, sessions, tokens); or
    - the session cookie set by `POST /auth/sign-in`. Requests that change
      state must then send the `X-CSRF-Token` header, whose value is in the
      `sm_csrf` cookie.
servers:
  - url: /api/v1
tags:
  - name: System
  - name: Webhooks
  - name: Auth
  - name: Profile
  - name: Users
    description: Instance user administration (instance admins only).
  - name: Organizations
  - name: Members
  - name: Invitations
  - name: Projects
  - name: Audit
  - name: Database
    description: SQL on a project's database, and saved snippets.
paths:
  # ---------------------------------------------------------------- System
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Report service and database health
      security: []
      responses:
        "200":
          description: Supermixer and its database are reachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: The database is unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        default: { $ref: "#/components/responses/Error" }
  /ui-config:
    get:
      operationId: getUiConfig
      tags: [System]
      summary: Settings the web UI needs before sign-in
      security: []
      responses:
        "200":
          description: UI configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UiConfig" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ Auth
  /auth/sign-in:
    post:
      operationId: signIn
      tags: [Auth]
      summary: Sign in with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignInRequest" }
      responses:
        "200":
          description: Signed in; session cookies are set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "202":
          description: The password is right and the account has two-factor sign-in; finish with POST /auth/mfa. No session yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaChallenge" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /auth/mfa:
    post:
      operationId: verifyMfa
      tags: [Auth]
      summary: Finish signing in with a code from the authenticator app, or a recovery code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaVerify" }
      responses:
        "200":
          description: Signed in; session cookies are set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /auth/password-reset:
    post:
      operationId: requestPasswordReset
      tags: [Auth]
      summary: Email a link to choose a new password
      description: |
        Always answers the same way, so it doesn't tell who has an account.
        If the username or email address is an active account's, and it has
        an email address, a link that works once, for an hour, is sent to it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login]
              properties:
                login: { type: string, description: Username or email address. }
      responses:
        "202": { description: "If there's such an account with an email address, a link is on its way." }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /auth/password-reset/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      operationId: getPasswordReset
      tags: [Auth]
      summary: Who a reset link is for, and whether it needs a two-factor code
      security: []
      responses:
        "200":
          description: The link works.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordResetInfo" }
        "410": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: completePasswordReset
      tags: [Auth]
      summary: Choose a new password with a reset link; every session is signed out
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetComplete" }
      responses:
        "204": { description: The password is changed; sign in with it. }
        "410": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /auth/sign-up:
    post:
      operationId: requestSignUp
      tags: [Auth]
      summary: Email a link to create an account (when Instance › Sign-up allows it)
      description: |
        Answers the same way whether or not the address already has an
        account, so it doesn't tell who has one: a new address gets a link
        that works once, for a day, and an address with an account gets an
        email saying so. Refused when sign-up is off (404) or the address's
        domain isn't allowed (400).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignUpRequest" }
      responses:
        "202": { description: An email is on its way. }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /auth/sign-up/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      operationId: getSignUp
      tags: [Auth]
      summary: The email address a sign-up link is for
      security: []
      responses:
        "200":
          description: The link works.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignUpInfo" }
        "410": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: completeSignUp
      tags: [Auth]
      summary: Create the account a sign-up link is for
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignUpComplete" }
      responses:
        "201":
          description: Created and signed in (session cookies set).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "202": { description: "Created; it waits for an instance admin's approval before it can sign in." }
        "410": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /auth/sign-out:
    post:
      operationId: signOut
      tags: [Auth]
      summary: End the current session
      responses:
        "204": { description: Signed out; cookies cleared. }
        default: { $ref: "#/components/responses/Error" }

  # --------------------------------------------------------------- Profile
  /profile:
    get:
      operationId: getProfile
      tags: [Profile]
      summary: The signed-in user
      responses:
        "200":
          description: Profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateProfile
      tags: [Profile]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdate" }
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        default: { $ref: "#/components/responses/Error" }
  /profile/password:
    post:
      operationId: changePassword
      tags: [Profile]
      summary: Change your password; other sessions are signed out
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204": { description: Password changed. }
        default: { $ref: "#/components/responses/Error" }
  /profile/mfa:
    get:
      operationId: getMfaStatus
      tags: [Profile]
      summary: Whether two-factor sign-in is on, and how many recovery codes are left
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaStatus" }
        default: { $ref: "#/components/responses/Error" }
  /profile/mfa/setup:
    post:
      operationId: setupMfa
      tags: [Profile]
      summary: Start setting up an authenticator app (needs your password)
      description: Returns a new secret to add to the app; POST /profile/mfa/enable with a code from it turns two-factor sign-in on.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirm" }
      responses:
        "200":
          description: The secret, as text, an otpauth URI and a QR code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaSetup" }
        default: { $ref: "#/components/responses/Error" }
  /profile/mfa/enable:
    post:
      operationId: enableMfa
      tags: [Profile]
      summary: Confirm the app with a code and turn two-factor sign-in on
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaCode" }
      responses:
        "200":
          description: On; the recovery codes, shown only now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        default: { $ref: "#/components/responses/Error" }
  /profile/mfa/disable:
    post:
      operationId: disableMfa
      tags: [Profile]
      summary: Turn two-factor sign-in off (needs your password and a code or recovery code)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaDisable" }
      responses:
        "204": { description: Off. }
        default: { $ref: "#/components/responses/Error" }
  /profile/mfa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags: [Profile]
      summary: Replace your recovery codes (needs a code from the app)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaCode" }
      responses:
        "200":
          description: The new codes, shown only now; the old ones stop working.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        default: { $ref: "#/components/responses/Error" }
  /profile/sessions:
    get:
      operationId: listSessions
      tags: [Profile]
      responses:
        "200":
          description: Active sessions, most recent first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }
        default: { $ref: "#/components/responses/Error" }
  /profile/sessions/{session_id}:
    delete:
      operationId: revokeSession
      tags: [Profile]
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Session revoked. }
        default: { $ref: "#/components/responses/Error" }
  /profile/access-tokens:
    get:
      operationId: listAccessTokens
      tags: [Profile]
      summary: Your personal access tokens
      responses:
        "200":
          description: Tokens, newest first (without their values).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccessToken" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAccessToken
      tags: [Profile]
      summary: Create a personal access token; its value is shown only now
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessTokenCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessTokenCreated" }
        default: { $ref: "#/components/responses/Error" }
  /profile/access-tokens/{token_id}:
    delete:
      operationId: deleteAccessToken
      tags: [Profile]
      summary: Revoke a personal access token
      parameters:
        - { name: token_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Revoked. }
        default: { $ref: "#/components/responses/Error" }
  /profile/identities:
    get:
      operationId: listIdentities
      tags: [Profile]
      summary: Single sign-on providers connected to your account
      description: |
        Connecting one is a browser flow: POST /profile/identities/{provider}/connect
        returns {"url": ...} to open; the provider sends you back to Account › Security.
        Signing in through one starts at GET /auth/sso/{provider}/start.
      responses:
        "200":
          description: Connected identities.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Identity" }
        default: { $ref: "#/components/responses/Error" }
  /profile/identities/{identity_id}:
    delete:
      operationId: deleteIdentity
      tags: [Profile]
      summary: Disconnect a sign-in provider from your account
      parameters:
        - { name: identity_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Disconnected. }
        default: { $ref: "#/components/responses/Error" }
  /profile/audit-logs:
    get:
      operationId: listMyAuditLogs
      tags: [Audit]
      summary: Your audit log
      description: |
        What you did, in any organization or outside them, and what others did to your account (an instance admin
        resetting your password or two-factor sign-in, say). Entries made by someone else leave out their IP address.
        Signed-in sessions only, not access tokens.
      parameters:
        - { name: action, in: query, required: false, description: "Action prefix, e.g. user.", schema: { type: string } }
        - { name: before, in: query, required: false, description: Cursor from next_before, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Entries, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogPage" }
        default: { $ref: "#/components/responses/Error" }
  /profile/permissions:
    get:
      operationId: getPermissions
      tags: [Profile]
      summary: Your role and permissions in every organization and project you can see
      responses:
        "200":
          description: Permissions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrganizationPermissions" }
        default: { $ref: "#/components/responses/Error" }

  # ----------------------------------------------------------------- Users
  /admin/users:
    get:
      operationId: listUsers
      tags: [Users]
      responses:
        "200":
          description: All users.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createUser
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
  /admin/users/{user_id}:
    patch:
      operationId: updateUser
      tags: [Users]
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
  /admin/users/{user_id}/approval:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: approveUser
      tags: [Users]
      summary: Let an account that signed up sign in (instance admins); it's told by email
      responses:
        "200":
          description: Approved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: declineUser
      tags: [Users]
      summary: Decline an account that signed up, deleting it (instance admins); it's told by email
      responses:
        "204": { description: Declined and deleted. }
        default: { $ref: "#/components/responses/Error" }
  /admin/users/{user_id}/sessions:
    delete:
      operationId: revokeUserSessions
      tags: [Users]
      summary: Sign the user out everywhere
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Signed out. }
        default: { $ref: "#/components/responses/Error" }
  /admin/users/{user_id}/mfa:
    delete:
      operationId: resetUserMfa
      tags: [Users]
      summary: Turn off someone's two-factor sign-in (a lost device) and sign them out everywhere
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Turned off. }
        default: { $ref: "#/components/responses/Error" }
  /admin/email/test:
    post:
      operationId: sendTestEmail
      tags: [Users]
      summary: Send a test email to your own address
      responses:
        "200":
          description: The server took it.
          content:
            application/json:
              schema:
                type: object
                required: [sent_to]
                properties:
                  sent_to: { type: string }
        default: { $ref: "#/components/responses/Error" }
  /notice:
    get:
      operationId: getNotice
      tags: [Users]
      summary: The instance-wide notice, if an instance admin posted one
      description: Shown to everyone, signed in or not (the homepage too), as a band above the header (downtime, say).
      security: []
      responses:
        "200":
          description: The notice, or none.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoticeState" }
        default: { $ref: "#/components/responses/Error" }
  /admin/sign-up:
    get:
      operationId: getSignUpSettings
      tags: [Users]
      summary: Whether people can create their own accounts, and how (instance admins)
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignUpSettings" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setSignUpSettings
      tags: [Users]
      summary: Change the sign-up settings (instance admins); turning it on needs email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignUpSettings" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignUpSettings" }
        default: { $ref: "#/components/responses/Error" }
  /admin/limits:
    get:
      operationId: getResourceLimits
      tags: [Users]
      summary: The instance's resource limits, and the most anyone uses now; instance admins only
      responses:
        "200":
          description: The limits.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceLimits" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setResourceLimits
      tags: [Users]
      summary: Set the instance's resource limits (null is unlimited); instance admins only
      description: Lowering a limit keeps what already exists; it stops new organizations or projects past it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceLimitsUpdate" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceLimits" }
        default: { $ref: "#/components/responses/Error" }
  /profile/limits:
    get:
      operationId: getMyLimits
      tags: [Profile]
      summary: How many organizations you've created, and how many you may
      responses:
        "200":
          description: Your limits.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyLimits" }
        default: { $ref: "#/components/responses/Error" }
  /admin/notice:
    put:
      operationId: setNotice
      tags: [Users]
      summary: Post (or replace) the instance-wide notice; instance admins only
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlobalNoticeInput" }
      responses:
        "200":
          description: Posted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalNotice" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteNotice
      tags: [Users]
      summary: Take the instance-wide notice down; instance admins only
      responses:
        "204": { description: Taken down (or there was none). }
        default: { $ref: "#/components/responses/Error" }
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [Users]
      summary: The instance at a glance, for instance admins
      responses:
        "200":
          description: Counts and settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
        default: { $ref: "#/components/responses/Error" }
  /admin/audit-logs:
    get:
      operationId: listInstanceAuditLogs
      tags: [Audit]
      summary: Audit entries outside any organization (accounts and sign-ins), for instance admins
      parameters:
        - { name: action, in: query, required: false, description: "Action prefix, e.g. user.", schema: { type: string } }
        - { name: before, in: query, required: false, description: Cursor from next_before, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Entries, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogPage" }
        default: { $ref: "#/components/responses/Error" }
  /admin/users/{user_id}/password:
    post:
      operationId: resetUserPassword
      tags: [Users]
      summary: Set a new password and sign the user out everywhere
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordReset" }
      responses:
        "204": { description: Password reset. }
        default: { $ref: "#/components/responses/Error" }

  # --------------------------------------------------------- Organizations
  /organizations:
    get:
      operationId: listOrganizations
      tags: [Organizations]
      responses:
        "200":
          description: Organizations you belong to.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Organization" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createOrganization
      tags: [Organizations]
      summary: Create an organization; you become its Owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        default: { $ref: "#/components/responses/Error" }
  /organizations/{slug}:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
    get:
      operationId: getOrganization
      tags: [Organizations]
      responses:
        "200":
          description: Organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateOrganization
      tags: [Organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteOrganization
      tags: [Organizations]
      summary: Delete an organization (it must have no projects)
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- Members
  /organizations/{slug}/members:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
    get:
      operationId: listMembers
      tags: [Members]
      responses:
        "200":
          description: Members.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        default: { $ref: "#/components/responses/Error" }
  /organizations/{slug}/members/{user_id}:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateMember
      tags: [Members]
      summary: Change a member's organization role and project-scoped roles
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeMember
      tags: [Members]
      summary: Remove a member, or leave the organization when it is you
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------ Invitations
  /organizations/{slug}/limits:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
    get:
      operationId: getOrganizationLimits
      tags: [Organizations]
      summary: The organization's project limit, the instance's, and how many projects it has
      responses:
        "200":
          description: The limits.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationLimits" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setOrganizationLimits
      tags: [Organizations]
      summary: Set the organization's own project limit, up to the instance's (Owners and Administrators)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationLimitsUpdate" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationLimits" }
        default: { $ref: "#/components/responses/Error" }
  /organizations/{slug}/sso:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
    get:
      operationId: getOrganizationSso
      tags: [Organizations]
      summary: The organization's single sign-on settings (Owners)
      responses:
        "200":
          description: Settings, and the instance's providers to choose from.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationSso" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateOrganizationSso
      tags: [Organizations]
      summary: Change the organization's single sign-on settings (Owners)
      description: |
        Requiring the provider needs you to be signed in through it now, so you don't lock yourself out. People
        joining through it (join_role) are added when they sign in with it, if their email address (as the provider
        vouches for it) is in join_domains, or always when join_domains is empty.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationSsoUpdate" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationSso" }
        default: { $ref: "#/components/responses/Error" }
  /organizations/{slug}/webhooks:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
    get:
      operationId: listWebhooks
      tags: [Webhooks]
      summary: The organization's webhooks (Owners)
      responses:
        "200":
          description: Webhooks.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Webhook" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createWebhook
      tags: [Webhooks]
      summary: Add a webhook (Owners)
      description: |
        The organization's audit log entries are POSTed to the URL one at a time, in order, as JSON, from when it's
        added. Each request has `X-Supermixer-Event` (the action), `X-Supermixer-Delivery` (the entry's id, the same
        on retries) and `X-Supermixer-Signature: t=<unix time>,v1=<hex HMAC-SHA256 of "<t>.<body>" with the secret>`.
        Answer 2xx; anything else is retried with backoff, holding back later events.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookCreate" }
      responses:
        "201":
          description: Added. The signing secret is only returned here (and when rotated).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookCreated" }
        default: { $ref: "#/components/responses/Error" }
  /organizations/{slug}/webhooks/{webhook_id}:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
      - { name: webhook_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateWebhook
      tags: [Webhooks]
      summary: Change a webhook, or turn it off and on (Owners)
      description: Turning a webhook back on starts with new events; what happened while it was off isn't sent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookUpdate" }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteWebhook
      tags: [Webhooks]
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Error" }
  /organizations/{slug}/webhooks/{webhook_id}/secret:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
      - { name: webhook_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: rotateWebhookSecret
      tags: [Webhooks]
      summary: Replace the signing secret; the old one stops working at once
      responses:
        "200":
          description: The new secret, only shown here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookSecret" }
        default: { $ref: "#/components/responses/Error" }
  /organizations/{slug}/webhooks/{webhook_id}/test:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
      - { name: webhook_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: testWebhook
      tags: [Webhooks]
      summary: Send a webhook.test event now and say how it went
      responses:
        "200":
          description: The attempt (also in the deliveries list).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDelivery" }
        default: { $ref: "#/components/responses/Error" }
  /organizations/{slug}/webhooks/{webhook_id}/deliveries:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
      - { name: webhook_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listWebhookDeliveries
      tags: [Webhooks]
      summary: The newest 100 attempts
      responses:
        "200":
          description: Attempts, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WebhookDelivery" }
        default: { $ref: "#/components/responses/Error" }
  /organizations/{slug}/invitations:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
    get:
      operationId: listInvitations
      tags: [Invitations]
      responses:
        "200":
          description: Pending invitations.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invitation" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createInvitation
      tags: [Invitations]
      summary: Create an invitation link (valid 7 days)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationCreate" }
      responses:
        "201":
          description: Created. The token is only returned here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationCreated" }
        default: { $ref: "#/components/responses/Error" }
  /organizations/{slug}/invitations/{invitation_id}:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
      - { name: invitation_id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: revokeInvitation
      tags: [Invitations]
      responses:
        "204": { description: Revoked. }
        default: { $ref: "#/components/responses/Error" }
  /invitations/{token}:
    parameters:
      - { $ref: "#/components/parameters/InvitationToken" }
    get:
      operationId: getInvitation
      tags: [Invitations]
      summary: What an invitation link is for (no sign-in needed)
      security: []
      responses:
        "200":
          description: Invitation details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationPreview" }
        default: { $ref: "#/components/responses/Error" }
  /invitations/{token}/accept:
    parameters:
      - { $ref: "#/components/parameters/InvitationToken" }
    post:
      operationId: acceptInvitation
      tags: [Invitations]
      summary: Join the organization as the signed-in user
      responses:
        "200":
          description: Joined.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        default: { $ref: "#/components/responses/Error" }
  /invitations/{token}/sign-up:
    parameters:
      - { $ref: "#/components/parameters/InvitationToken" }
    post:
      operationId: signUpWithInvitation
      tags: [Invitations]
      summary: Create an account from an invitation and join; signs you in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationSignUp" }
      responses:
        "201":
          description: Account created and session cookies set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        default: { $ref: "#/components/responses/Error" }

  # --------------------------------------------------------------- Projects
  /projects:
    get:
      operationId: listProjects
      tags: [Projects]
      summary: Projects you can see, across organizations
      parameters:
        - { name: organization_slug, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Projects.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
  /organizations/{slug}/projects:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
    post:
      operationId: createProject
      tags: [Projects]
      summary: Register an existing self-hosted Supabase stack as a project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCreate" }
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
  /organizations/{slug}/projects/new-stack:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
    post:
      operationId: createStack
      tags: [Projects]
      summary: Create a new self-hosted Supabase stack and add it as a project
      description: |
        Needs provisioning.enabled. The project is created at once with stack
        status provisioning; the stack starts in the background (image
        downloads can take minutes). Follow it with GET /projects/{ref}/stack.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 64 }
      responses:
        "202":
          description: Created; the stack is starting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
  /organizations/{slug}/projects/test-connection:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
    post:
      operationId: testConnection
      tags: [Projects]
      summary: Check connection details before registering a project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectConnection" }
      responses:
        "200":
          description: Results of each check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: getProject
      tags: [Projects]
      responses:
        "200":
          description: Project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateProject
      tags: [Projects]
      summary: Rename a project or update its connection details
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProject
      tags: [Projects]
      summary: Unregister a project. The Supabase stack itself is untouched.
      responses:
        "204": { description: Unregistered. }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/transfer:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    post:
      operationId: transferProject
      tags: [Projects]
      summary: Move a project to another organization you own
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectTransfer" }
      responses:
        "200":
          description: Moved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/health:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: getProjectHealth
      tags: [Projects]
      responses:
        "200":
          description: Health of each service (cached for 15 seconds).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/stack:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: getStack
      tags: [Projects]
      summary: A created stack's status, containers and recent output
      responses:
        "200":
          description: The stack.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StackDetail" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/stack/{action}:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
      - name: action
        in: path
        required: true
        schema: { type: string, enum: [start, stop, restart] }
    post:
      operationId: stackAction
      tags: [Projects]
      summary: Start (or retry), stop (pause) or restart a created stack
      description: Runs in the background; follow it with GET /projects/{ref}/stack.
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StackDetail" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/functions:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: listEdgeFunctions
      tags: [Edge Functions]
      summary: The Edge Functions of a stack Supermixer created
      responses:
        "200":
          description: Functions, by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EdgeFunction" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/functions/{name}:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      operationId: getEdgeFunction
      tags: [Edge Functions]
      summary: A function and its files
      responses:
        "200":
          description: The function.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeFunctionDetail" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: deployEdgeFunction
      tags: [Edge Functions]
      summary: Create or replace a function, then restart the functions service
      description: |
        The function's folder is replaced by these files, plus the existing
        files listed in keep (ones that can't be edited as text). If the
        stack is running, its functions service is recreated so the change
        takes effect; otherwise it does when the stack next starts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { $ref: "#/components/schemas/EdgeFunctionFile" }
                keep:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Deployed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeFunctionChange" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteEdgeFunction
      tags: [Edge Functions]
      summary: Delete a function
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeFunctionChange" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/functions/{name}/versions:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      operationId: listFunctionVersions
      tags: [Edge Functions]
      summary: A function's kept versions, newest first
      description: The last 10 deploys of a function, kept even after it's deleted, with each file's SHA-256.
      responses:
        "200":
          description: The versions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FunctionVersion" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/functions/{name}/versions/{id}:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getFunctionVersion
      tags: [Edge Functions]
      summary: A kept version and its files
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FunctionVersionDetail" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/functions/{name}/versions/{id}/restore:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: restoreFunctionVersion
      tags: [Edge Functions]
      summary: Deploy a kept version again
      responses:
        "200":
          description: Restored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeFunctionChange" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/rotation-advisories:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: listRotationAdvisories
      tags: [Projects]
      summary: People who could read this project's keys and lost that access
      description: |
        They may still have the keys, so the project's keys should be rotated. The list is cleared
        by rotating the secret key and the JWT secret together (stacks Supermixer created), or by
        dismissing it.
      responses:
        "200":
          description: The advisories, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RotationAdvisory" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: dismissRotationAdvisories
      tags: [Projects]
      summary: Dismiss the advisories (after rotating the keys where the stack runs)
      responses:
        "204": { description: Dismissed. }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/advisors/snapshots:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: listDBSnapshots
      tags: [Advisors]
      summary: Snapshots of the database's objects, newest first
      description: |
        Fingerprints of the objects that could keep someone in: roles, SECURITY DEFINER functions,
        triggers, event triggers, cron jobs and Auth users' passwords and roles. Taken before each
        function deploy and on demand; the newest 20 are kept.
      responses:
        "200":
          description: The snapshots.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DBSnapshot" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createDBSnapshot
      tags: [Advisors]
      summary: Take a snapshot now, to compare with later
      responses:
        "201":
          description: Taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DBSnapshot" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/advisors/changes:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
      - name: since
        in: query
        description: The snapshot to compare with; the newest if left out.
        schema: { type: string, format: uuid }
    get:
      operationId: getDBChanges
      tags: [Advisors]
      summary: What changed in the database since a snapshot
      responses:
        "200":
          description: The changes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DBChanges" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/stack/upgrade:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: getStackUpgrade
      tags: [Projects]
      summary: What upgrading the stack to the Supabase version Supermixer bundles would change
      responses:
        "200":
          description: The upgrade.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StackUpgrade" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: upgradeStack
      tags: [Projects]
      summary: Upgrade the stack to the Supabase version Supermixer bundles
      description: |
        Backs the database up, renders the stack's files from the new version (its .env and Edge
        Functions kept), pulls the new images and recreates the services that changed. If the stack
        doesn't come up, it goes back to its previous files and images. Runs in the background.
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StackDetail" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/stack/rotate-keys:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    post:
      operationId: rotateStackKeys
      tags: [Projects]
      summary: Replace some of a created stack's keys
      description: |
        Writes new values to the stack's .env and Supermixer's copy, then (if the stack runs) recreates
        the services that use them. Old values stop working at once, except the previous signing key,
        which still verifies sessions it signed until the next rotation. Runs in the background.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keys]
              properties:
                keys:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [secret_key, publishable_key, signing_key, jwt_secret, functions_db_password, s3_keys]
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StackDetail" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/storage/config:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: getStorageConfig
      tags: [Projects]
      summary: A created stack's Storage settings
      description: Stacks Supermixer connects to set these where they run (409).
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageConfig" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateStorageConfig
      tags: [Projects]
      summary: Change a created stack's Storage settings; Storage restarts if it's running
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageConfigUpdate" }
      responses:
        "200":
          description: Saved (and applied, if the stack runs).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageConfig" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/storage/s3:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: getStorageS3
      tags: [Projects]
      summary: How to reach Storage with S3 clients
      description: |
        Storage speaks the S3 protocol at <API URL>/storage/v1/s3. For stacks Supermixer created, the region and
        access key pair come from the stack's .env; the secret only with reveal=true, for roles that may see secret
        keys. New keys: POST /projects/{ref}/stack/rotate-keys with s3_keys.
      parameters:
        - { name: reveal, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: The connection details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageS3" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/log-drains:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: listLogDrains
      tags: [Projects]
      summary: Where a created stack's logs are also sent
      responses:
        "200":
          description: The drains; secrets are never returned.
          content:
            application/json:
              schema:
                type: object
                required: [drains]
                properties:
                  drains:
                    type: array
                    items: { $ref: "#/components/schemas/LogDrain" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createLogDrain
      tags: [Projects]
      summary: Add a log drain
      description: Vector checks the new configuration first, then restarts with it if the stack runs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogDrainInput" }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogDrain" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/log-drains/{id}:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateLogDrain
      tags: [Projects]
      summary: Change a log drain
      description: Header values and the API key are kept when left out.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogDrainInput" }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogDrain" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteLogDrain
      tags: [Projects]
      summary: Remove a log drain
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/backups:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: listBackups
      tags: [Backups]
      summary: Database backups of a stack Supermixer created, newest first
      responses:
        "200":
          description: Backups, and the schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createBackup
      tags: [Backups]
      summary: Back the database up now
      description: Runs in the background; poll the list. Needs project settings access.
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/backups/{id}:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteBackup
      tags: [Backups]
      summary: Delete a backup and its files, in the bucket too
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/backups/{id}/upload:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: retryBackupUpload
      tags: [Backups]
      summary: Try copying a backup to the bucket again now
      description: After a failed upload, Supermixer tries again on its own, waiting longer each time (an hour at most).
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/backups/{id}/files/{file}:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - name: file
        in: path
        required: true
        schema: { type: string, enum: [roles.sql, schema.sql, data.sql] }
    get:
      operationId: downloadBackupFile
      tags: [Backups]
      summary: Download one of a backup's dumps
      description: |
        The data dump holds every row, Auth's users included, so this needs project settings
        access and is recorded in the audit log. Restore elsewhere as Supabase documents:
        psql --single-transaction -v ON_ERROR_STOP=1 -f roles.sql -f schema.sql -f data.sql.
      responses:
        "200":
          description: The SQL.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/backups/{id}/restore:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: restoreBackup
      tags: [Backups]
      summary: Restore a backup into this project
      description: |
        Takes a backup of the current database first, then starts a fresh database and replays the
        backup into it. The project is offline meanwhile, and changes since the backup are lost. If the
        restore fails, the project goes back to its previous database. Runs in the background.
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StackDetail" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/backups/{id}/restore-to-new:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: restoreBackupToNewProject
      tags: [Backups]
      summary: Create a new project from a backup
      description: A new stack in the same organization, with its own keys, started and then restored from the backup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "202":
          description: Creating.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/auth-config:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: getAuthConfig
      tags: [Auth]
      summary: Auth settings of a stack Supermixer created
      description: |
        Named as in Supabase's Management API (/v1/projects/{ref}/config/auth). A value is null when
        it's left to Auth's default. Secrets are never returned; secrets_set names those that are set.
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateAuthConfig
      tags: [Auth]
      summary: Change Auth settings, then restart the auth service
      description: |
        Only the given settings change; null puts one back to its default. Needs project settings
        access (Owners and Administrators), and is recorded in the audit log (names only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/function-settings:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: getFunctionSettings
      tags: [Edge Functions]
      summary: How a created stack's Edge Functions reach its database
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FunctionSettings" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setFunctionSettings
      tags: [Edge Functions]
      summary: Change what Edge Functions can reach, then restart the functions service
      description: Needs project settings access (Owners and Administrators). Recorded in the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FunctionSettingsUpdate" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/FunctionSettings" }
                  - type: object
                    required: [restarted]
                    properties:
                      restarted: { type: boolean }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/function-secrets:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: listFunctionSecrets
      tags: [Edge Functions]
      summary: The names of a stack's Edge Function secrets, with digests of their values
      responses:
        "200":
          description: Secrets, by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FunctionSecret" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setFunctionSecrets
      tags: [Edge Functions]
      summary: Add or change secrets, then restart the functions service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secrets]
              properties:
                secrets:
                  type: array
                  items:
                    type: object
                    required: [name, value]
                    properties:
                      name: { type: string }
                      value: { type: string }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FunctionSecretsChange" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteFunctionSecrets
      tags: [Edge Functions]
      summary: Remove secrets, then restart the functions service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [names]
              properties:
                names:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FunctionSecretsChange" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/studio-login:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    post:
      operationId: revealStudioLogin
      tags: [Projects]
      summary: The user name and password of a created stack's Studio
      description: |
        Studio is served by the stack's API gateway behind basic auth, with
        credentials Supermixer generated. Needs the same access as revealing
        secret API keys, and is recorded in the audit log.
      responses:
        "200":
          description: The login.
          content:
            application/json:
              schema:
                type: object
                required: [username, password]
                properties:
                  username: { type: string }
                  password: { type: string }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/advisors/lints:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: listLints
      tags: [Projects]
      summary: Run Supabase's database linter (splinter) on the project's database.
      description: |
        The checks behind the Security and Performance Advisors. They run in a
        read-only transaction as the project's admin user.
      responses:
        "200":
          description: Findings, most severe first.
          content:
            application/json:
              schema:
                type: object
                required: [lints, ran_at]
                properties:
                  lints:
                    type: array
                    items: { $ref: "#/components/schemas/Lint" }
                  ran_at: { type: string, format: date-time }
        "422":
          description: The linter failed on this database.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryError" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/logs:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: listLogs
      tags: [Projects]
      summary: Log entries from the stack's log analytics (Logflare), newest first.
      description: |
        Read from the log tables Logflare keeps in the stack's _supabase
        database, in a read-only transaction. Only log tables are reachable.
      parameters:
        - { name: source, in: query, required: true, schema: { $ref: "#/components/schemas/LogSource" } }
        - { name: search, in: query, required: false, description: Words the message must all contain, in any order, schema: { type: string, maxLength: 200 } }
        - { name: since, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: before, in: query, required: false, description: Only entries older than this (paging), schema: { type: string, format: date-time } }
        - { name: before_id, in: query, required: false, description: "With before: the last entry already shown, so entries sharing its timestamp aren't skipped", schema: { type: string, maxLength: 64 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Entries, or available false when the stack doesn't run log analytics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogPage" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/logs/requests:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: getRequestStats
      tags: [Projects]
      summary: API gateway requests since a time, by hour, status and path.
      parameters:
        - { name: since, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Request counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestStats" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{ref}/api-keys:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: listApiKeys
      tags: [Projects]
      summary: The project's API keys. Secret values only with reveal=true.
      parameters:
        - { name: reveal, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Keys.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiKey" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ Audit
  /organizations/{slug}/audit-logs:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
    get:
      operationId: listAuditLogs
      tags: [Audit]
      parameters:
        - { name: action, in: query, required: false, description: Action prefix, e.g. "project." , schema: { type: string } }
        - { name: actor_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: since, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: before, in: query, required: false, description: Cursor from next_before, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Entries, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogPage" }
        default: { $ref: "#/components/responses/Error" }

  /projects/{ref}/read-only-user:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    post:
      operationId: createReadOnlyUser
      tags: [Projects]
      summary: Create a read-only database login for Read-only members' queries.
      description: |
        Creates a LOGIN role with pg_read_all_data (and BYPASSRLS, like
        Supabase's own read-only user) on the project's database, tests it and
        stores its password encrypted. Read-only queries then run as that user,
        which cannot write, change role or signal other connections.
      responses:
        "200":
          description: The project, now with database.read_only_user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteReadOnlyUser
      tags: [Projects]
      summary: Drop the read-only login; read-only queries go back to a read-only transaction.
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ SQL
  /projects/{ref}/query:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    post:
      operationId: runQuery
      tags: [Database]
      summary: Run SQL on the project's database.
      description: |
        Members without data write access run one statement at a time, in a
        read-only transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueryRequest" }
      responses:
        "200":
          description: One result per statement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryResponse" }
        "422":
          description: Postgres rejected the SQL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryError" }
        default: { $ref: "#/components/responses/Error" }

  /projects/{ref}/snippets:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      operationId: listSnippets
      tags: [Database]
      summary: Your snippets and the ones shared with the project.
      responses:
        "200":
          description: Snippets, most recently updated first (without content).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Snippet" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createSnippet
      tags: [Database]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SnippetCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snippet" }
        default: { $ref: "#/components/responses/Error" }

  /projects/{ref}/snippets/{snippet_id}:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
      - { name: snippet_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSnippet
      tags: [Database]
      responses:
        "200":
          description: The snippet with its content.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snippet" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateSnippet
      tags: [Database]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SnippetUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snippet" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSnippet
      tags: [Database]
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Error" }

components:
  parameters:
    Slug: { name: slug, in: path, required: true, schema: { type: string } }
    Ref: { name: ref, in: path, required: true, schema: { type: string } }
    InvitationToken: { name: token, in: path, required: true, schema: { type: string } }
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    QueryRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, maxLength: 1000000 }
        params:
          type: array
          description: Text values for $1, $2, …; only one statement is allowed with params.
          items: { type: string, nullable: true }
        read_only: { type: boolean, default: false, description: Run read-only even if you may write. }
        max_rows: { type: integer, minimum: 1, maximum: 10000, description: "Rows to return; defaults to projects.query_max_rows." }
    QueryColumn:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, description: "Postgres type name, or its OID when unknown." }
    QueryResult:
      type: object
      required: [command, row_count, columns, rows, truncated]
      properties:
        command: { type: string, example: SELECT }
        row_count: { type: integer, format: int64 }
        columns:
          type: array
          items: { $ref: "#/components/schemas/QueryColumn" }
        rows:
          type: array
          items:
            type: array
            items: {}
        truncated: { type: boolean, description: More rows matched than max_rows. }
        notices:
          type: array
          items: { type: string }
    QueryResponse:
      type: object
      required: [results, read_only, duration_ms]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/QueryResult" }
        read_only: { type: boolean }
        duration_ms: { type: integer, format: int64 }
    QueryError:
      type: object
      required: [message]
      properties:
        message: { type: string }
        code: { type: string, description: SQLSTATE }
        detail: { type: string }
        hint: { type: string }
        position: { type: integer, description: 1-based character offset in the query. }
    SnippetVisibility:
      type: string
      enum: [private, project]
    Snippet:
      type: object
      required: [id, name, visibility, owner_id, owner_username, created_at, updated_at, can_edit]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        content: { type: string, description: Only on single-snippet responses. }
        visibility: { $ref: "#/components/schemas/SnippetVisibility" }
        favorite: { type: boolean }
        owner_id: { type: string, format: uuid }
        owner_username: { type: string }
        can_edit: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SnippetCreate:
      type: object
      required: [name, content]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        content: { type: string, maxLength: 1000000 }
        visibility: { $ref: "#/components/schemas/SnippetVisibility" }
    SnippetUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        content: { type: string, maxLength: 1000000 }
        visibility: { $ref: "#/components/schemas/SnippetVisibility" }
        favorite: { type: boolean }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        code:
          type: string
          description: "Set for errors a client handles specially: password_change_required (403), the account must choose a new password first; mfa_required (403), the organization requires two-factor sign-in, which the account hasn't turned on; sso_required (403), the organization requires signing in through its single sign-on provider, and this session (or access token) didn't; limit_reached (403), a resource limit stops it (Instance › Resource Limits, or the organization's own); approval_pending (403), the account signed up and waits for an instance admin's approval; docker_networks_full (503), Docker on this server has no room for another stack's network."
    OrgRole:
      type: string
      enum: [owner, administrator, developer, read_only, no_access]
    ProjectRole:
      type: string
      enum: [administrator, developer, read_only]

    Health:
      type: object
      required: [status, version, database]
      properties:
        status: { type: string, enum: [healthy, unhealthy] }
        version: { type: string }
        database:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [healthy, unhealthy] }
            schema_version: { type: integer, format: int64 }
            installed_at: { type: string, format: date-time }
            error: { type: string }
    UiConfig:
      type: object
      required: [app_name, version, brand_color, default_theme, provisioning, email_enabled, sign_up_enabled, sso_providers]
      properties:
        sso_providers:
          type: array
          description: Single sign-on providers, for "Continue with" buttons.
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
        app_name: { type: string }
        email_enabled: { type: boolean, description: "Supermixer sends email, so the sign-in page offers \"Forgot your password?\"." }
        sign_up_enabled: { type: boolean, description: "People can create their own accounts, so the sign-in page offers it." }
        version: { type: string }
        brand_color: { type: string, description: "appearance.brand_color as #rrggbb" }
        default_theme: { type: string, enum: [dark, light, system] }
        provisioning:
          type: object
          required: [enabled, template]
          description: Whether this server can create stacks, and from which supabase/docker commit.
          properties:
            enabled: { type: boolean }
            template: { type: string }

    StackStatus:
      type: string
      enum: [provisioning, running, paused, failed, deleting]
    Stack:
      type: object
      required: [status, error, template]
      description: Set on projects Supermixer created; null for connected ones.
      properties:
        status: { $ref: "#/components/schemas/StackStatus" }
        error: { type: string, description: "What went wrong, when status is failed." }
        status_at: { type: string, format: date-time, nullable: true }
        template: { type: string, description: The supabase/supabase commit the stack was made from. }
        operation:
          type: string
          enum: [starting, stopping, restarting, deleting, updating, backing_up, restoring, upgrading, rotating_keys]
          nullable: true
          description: What Supermixer is doing to the stack right now.
    EdgeFunction:
      type: object
      required: [name, url, updated_at, files, size, entrypoint]
      properties:
        name: { type: string }
        url: { type: string, description: "Where it's invoked, through the stack's API gateway." }
        updated_at: { type: string, format: date-time }
        files: { type: integer }
        size: { type: integer, description: "Bytes, all files together." }
        entrypoint: { type: string, nullable: true, description: The file it starts from; null if it has none. }
    EdgeFunctionFile:
      type: object
      required: [path, content]
      properties:
        path: { type: string, description: "Relative, with /: index.ts, lib/db.ts" }
        content: { type: string }
    EdgeFunctionDetail:
      type: object
      required: [function, files, other_files, sha256]
      properties:
        function: { $ref: "#/components/schemas/EdgeFunction" }
        sha256: { type: string, description: "The deployed files' hash, as a version's (FunctionVersion.sha256)." }
        files:
          type: array
          items: { $ref: "#/components/schemas/EdgeFunctionFile" }
        other_files:
          type: array
          items: { type: string }
          description: Files that can't be edited as text (binary, over 1 MiB, links). Pass them as keep to deploy without removing them.
    EdgeFunctionChange:
      type: object
      required: [restarted]
      properties:
        function: { $ref: "#/components/schemas/EdgeFunction" }
        restarted: { type: boolean, description: Whether the functions service was recreated; false while the stack isn't running. }
        version: { $ref: "#/components/schemas/FunctionVersion" }
    DBSnapshot:
      type: object
      required: [id, taken_at, reason, detail, taken_by]
      properties:
        id: { type: string, format: uuid }
        taken_at: { type: string, format: date-time }
        reason: { type: string, enum: [manual, function_deploy] }
        detail: { type: string, description: "For function_deploy, the function's name." }
        taken_by: { type: string }
    DBChange:
      type: object
      required: [key]
      properties:
        key: { type: string }
        label: { type: string, description: "For Auth users, their email or phone now." }
        before: { description: The fingerprint in the snapshot. }
        after: { description: The fingerprint now. }
    DBChanges:
      type: object
      required: [since, checked_at, superuser, categories]
      properties:
        since: { $ref: "#/components/schemas/DBSnapshot" }
        checked_at: { type: string, format: date-time }
        superuser:
          type: boolean
          description: "Whether the database was read as a superuser: role passwords and every role's cron jobs are covered then."
        categories:
          type: array
          items:
            type: object
            required: [name, label, added, removed, changed]
            properties:
              name: { type: string }
              label: { type: string }
              skipped: { type: string, description: Why it couldn't be compared. }
              added:
                type: array
                items: { $ref: "#/components/schemas/DBChange" }
              removed:
                type: array
                items: { $ref: "#/components/schemas/DBChange" }
              changed:
                type: array
                items: { $ref: "#/components/schemas/DBChange" }
    RotationAdvisory:
      type: object
      required: [username, reason, created_at]
      properties:
        username: { type: string }
        reason: { type: string, enum: [removed, left, role_changed, disabled, transferred] }
        created_at: { type: string, format: date-time }
    FunctionVersion:
      type: object
      required: [id, kind, created_at, sha256, files, size]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [deployed, restored, found]
          description: "found: the function as Supermixer found it before changing it, deployed before versions were kept or changed outside Supermixer."
        created_at: { type: string, format: date-time }
        created_by: { type: string, description: "Who deployed or restored it." }
        restored_from: { type: string, description: The version a restored one copies. }
        sha256: { type: string, description: "The whole function's hash: SHA-256 of its files' paths and hashes." }
        size: { type: integer, format: int64 }
        files:
          type: array
          items:
            type: object
            required: [path, sha256, size]
            properties:
              path: { type: string }
              sha256: { type: string }
              size: { type: integer, format: int64 }
              link: { type: string, description: "A symbolic link's target (its hash is of the target)." }
              unreadable: { type: boolean, description: "A file Supermixer couldn't read (one a container's user wrote): listed, but not hashed or kept." }
    FunctionVersionDetail:
      type: object
      required: [version, files, other_files]
      properties:
        version: { $ref: "#/components/schemas/FunctionVersion" }
        files:
          type: array
          items: { $ref: "#/components/schemas/EdgeFunctionFile" }
        other_files:
          type: array
          items: { type: string }
          description: Files that can't be shown as text.
    ResourceLimits:
      type: object
      required: [max_organizations_per_user, max_projects_per_organization, most_organizations_by_one_person, most_projects_in_one_organization]
      properties:
        max_organizations_per_user:
          type: integer
          nullable: true
          description: The most organizations one person may create (instance admins aren't held to it); null if unlimited.
        max_projects_per_organization:
          type: integer
          nullable: true
          description: The most projects any organization may have; null if unlimited.
        most_organizations_by_one_person: { type: integer, description: The most organizations anyone has created now. }
        most_projects_in_one_organization: { type: integer, description: The most projects any organization has now. }
    ResourceLimitsUpdate:
      type: object
      required: [max_organizations_per_user, max_projects_per_organization]
      properties:
        max_organizations_per_user: { type: integer, nullable: true, minimum: 1, maximum: 100000 }
        max_projects_per_organization: { type: integer, nullable: true, minimum: 1, maximum: 100000 }
    MyLimits:
      type: object
      required: [organizations_created]
      properties:
        organizations_created: { type: integer }
        max_organizations:
          type: integer
          nullable: true
          description: The most you may create; null if unlimited (or you're an instance admin).
    OrganizationLimits:
      type: object
      required: [project_count]
      properties:
        max_projects: { type: integer, nullable: true, description: "The organization's own limit; null if it set none." }
        instance_max_projects: { type: integer, nullable: true, description: "The instance's limit per organization; null if unlimited." }
        project_limit: { type: integer, nullable: true, description: "The lower of the two; null if unlimited." }
        project_count: { type: integer }
    OrganizationLimitsUpdate:
      type: object
      required: [max_projects]
      properties:
        max_projects: { type: integer, nullable: true, minimum: 1, maximum: 100000, description: "null removes the organization's own limit (the instance's still applies)." }
    NoticeType:
      type: string
      enum: [info, warning, critical]
    GlobalNoticeInput:
      type: object
      required: [type, message]
      properties:
        type: { $ref: "#/components/schemas/NoticeType" }
        message: { type: string, description: "Up to 256 characters; runs of whitespace (line breaks too) become one space." }
    GlobalNotice:
      type: object
      required: [type, message, posted_at, posted_by]
      properties:
        type: { $ref: "#/components/schemas/NoticeType" }
        message: { type: string }
        posted_at: { type: string, format: date-time }
        posted_by: { type: string, description: The instance admin's username. }
    NoticeState:
      type: object
      properties:
        notice: { allOf: [{ $ref: "#/components/schemas/GlobalNotice" }], nullable: true }
    StorageConfig:
      type: object
      required: [file_size_limit, image_transformation]
      properties:
        file_size_limit: { type: integer, format: int64, description: "The largest upload, in bytes, for every bucket (a bucket's own limit can only be lower)." }
        image_transformation: { type: boolean, description: Resizing images on the fly (render/image URLs). }
        restarted: { type: boolean, description: "After a change: whether Storage restarted to apply it (not if the stack is paused, or nothing changed)." }
        problems:
          type: array
          items: { $ref: "#/components/schemas/StorageProblem" }
          description: Values in the stack's .env Supermixer can't read (edited by hand). Storage gets them as they are; the setting shows its default, and saving it replaces the value.
    StorageProblem:
      type: object
      required: [setting, message]
      properties:
        setting: { type: string, enum: [file_size_limit, image_transformation] }
        message: { type: string }
    StorageConfigUpdate:
      type: object
      properties:
        file_size_limit: { type: integer, format: int64 }
        image_transformation: { type: boolean }
    StorageS3:
      type: object
      required: [endpoint, managed]
      properties:
        endpoint: { type: string }
        managed: { type: boolean, description: "Supermixer created the stack, so it knows (and can replace) the keys." }
        region: { type: string, nullable: true }
        access_key_id: { type: string, nullable: true }
        secret_access_key: { type: string, nullable: true, description: Only with reveal=true. }
    LogDrain:
      type: object
      required: [id, name, type, enabled, url, headers, gzip, datadog_site, api_key_set]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [http, loki, datadog] }
        enabled: { type: boolean }
        url: { type: string, description: "The HTTP endpoint, or Loki's base URL." }
        headers:
          type: array
          items:
            type: object
            required: [name, value_set]
            properties:
              name: { type: string }
              value_set: { type: boolean }
        gzip: { type: boolean }
        datadog_site: { type: string }
        api_key_set: { type: boolean }
    LogDrainInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, enum: [http, loki, datadog] }
        enabled: { type: boolean, default: true }
        url: { type: string }
        headers:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              value: { type: string, description: Left out to keep the current value. }
        gzip: { type: boolean }
        datadog_site: { type: string }
        api_key: { type: string, description: Left out (or empty) to keep the current key. }
    StackUpgrade:
      type: object
      required: [current, latest, up_to_date, images, new_keys]
      properties:
        current: { type: string, description: The supabase/supabase commit the stack's files come from. }
        latest: { type: string, description: The commit Supermixer bundles. }
        up_to_date: { type: boolean }
        images:
          type: array
          description: Services whose image changes. from is empty for a new service, to for a removed one.
          items:
            type: object
            required: [service, from, to]
            properties:
              service: { type: string }
              from: { type: string }
              to: { type: string }
        new_keys:
          type: array
          description: .env settings the new version adds (generated, or the template's defaults).
          items: { type: string }
        blocked: { type: string, description: "Why the upgrade can't run, if it can't." }
    Backup:
      type: object
      required: [id, kind, status, error, size_bytes, template, postgres_version, started_at, local, upload_error]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [scheduled, manual, pre_restore, pre_upgrade] }
        status: { type: string, enum: [running, completed, failed] }
        error: { type: string }
        size_bytes: { type: integer, format: int64, description: Compressed. }
        template: { type: string }
        postgres_version: { type: string }
        created_by: { type: string, nullable: true, description: "Username, for manual backups." }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        local: { type: boolean, description: "Whether the files are on Supermixer's disk (backups_dir)." }
        remote:
          type: string
          nullable: true
          description: "The copy in a bucket, as s3://bucket/key, once uploaded."
        upload_error: { type: string, description: "Why the last upload to the bucket failed; empty if it didn't." }
    BackupList:
      type: object
      required: [backups, interval_hours, keep]
      properties:
        backups:
          type: array
          items: { $ref: "#/components/schemas/Backup" }
        interval_hours: { type: number, description: How often scheduled backups run; 0 when they're off. }
        keep: { type: integer, description: Scheduled backups kept. }
        s3:
          type: object
          nullable: true
          description: The bucket backups are copied to, if one is set up.
          required: [location, endpoint, keep_local]
          properties:
            location: { type: string, description: "s3://bucket/prefix/<ref>" }
            endpoint: { type: string }
            keep_local: { type: boolean, description: "Whether backups stay in backups_dir after they're copied." }
    AuthConfig:
      type: object
      required: [values, secrets_set, callback_url]
      properties:
        values:
          type: object
          additionalProperties: true
          description: Setting name → true/false, a number, text, or null (Auth's default).
        secrets_set:
          type: array
          items: { type: string }
        callback_url: { type: string, description: The redirect URL to register with OAuth providers. }
        restarted: { type: boolean, description: "After a change, whether the auth service was recreated." }
    FunctionSettings:
      type: object
      required: [database_access, admin_access]
      properties:
        database_access:
          type: string
          enum: [service_role, postgres]
          description: |
            The login in SUPABASE_DB_URL. service_role: functions_user, whose sessions act as
            service_role (the same access as the service-role key). postgres: the stack's postgres
            login, which can also create roles and change Auth's and Realtime's tables.
        admin_access:
          type: boolean
          description: |
            Whether functions get SUPABASE_SERVICE_ROLE_KEY, SUPABASE_SECRET_KEYS and SUPABASE_DB_URL
            (the default). Without them a function acts as its caller, with the caller's token and
            the publishable or anon key: deployed code can't bypass Row Level Security, but
            functions that use admin APIs or the database URL stop working.
    FunctionSettingsUpdate:
      type: object
      properties:
        database_access: { type: string, enum: [service_role, postgres] }
        admin_access: { type: boolean }
    FunctionSecret:
      type: object
      required: [name, digest]
      properties:
        name: { type: string }
        digest: { type: string, description: "The value's SHA-256, in hex." }
    FunctionSecretsChange:
      type: object
      required: [secrets, restarted]
      properties:
        secrets:
          type: array
          items: { $ref: "#/components/schemas/FunctionSecret" }
        restarted: { type: boolean }
    StackDetail:
      allOf:
        - { $ref: "#/components/schemas/Stack" }
        - type: object
          required: [ports, services, log]
          properties:
            ports:
              type: object
              required: [api, db, pooler]
              properties:
                api: { type: integer }
                db: { type: integer }
                pooler: { type: integer }
            services:
              type: array
              nullable: true
              description: The stack's containers; null when Docker couldn't be asked.
              items:
                type: object
                required: [service, state, health, status]
                properties:
                  service: { type: string }
                  state: { type: string }
                  health: { type: string }
                  status: { type: string }
            services_error: { type: string, nullable: true }
            log: { type: string, description: The end of Supermixer's log of docker compose output for this stack. }

    SignInRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    Profile:
      type: object
      required: [id, username, display_name, is_instance_admin, default_password, password_change_required, mfa_enabled, has_password, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, nullable: true }
        display_name: { type: string }
        is_instance_admin: { type: boolean }
        default_password:
          type: boolean
          description: Still using the well-known bootstrap password.
        password_change_required:
          type: boolean
          description: "Must choose a new password before anything else; until then the API only allows the profile, changing the password and signing out."
        mfa_enabled: { type: boolean, description: Signs in with a code from an authenticator app as well as the password. }
        has_password: { type: boolean, description: "False for accounts made through single sign-on, until they set one (\"Forgot your password?\")." }
        theme:
          allOf: [{ $ref: "#/components/schemas/ThemePreference" }]
          nullable: true
          description: The theme the user chose; null if they haven't, and the instance default applies.
        created_at: { type: string, format: date-time }
    ThemePreference:
      type: string
      enum: [dark, light, system]
    ProfileUpdate:
      type: object
      properties:
        display_name: { type: string, maxLength: 64 }
        email: { type: string, nullable: true }
        theme: { $ref: "#/components/schemas/ThemePreference" }
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string }
    PasswordReset:
      type: object
      required: [password]
      properties:
        password: { type: string }
        require_password_change: { type: boolean, default: true, description: "They choose their own password at next sign-in (not for your own account)." }
    Identity:
      type: object
      required: [id, provider, provider_name, email, created_at]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        provider_name: { type: string, description: "The provider's name, or its id if it's no longer set up." }
        email: { type: string, description: "The address the provider gave, if it vouched for one." }
        created_at: { type: string, format: date-time }
        last_sign_in_at: { type: string, format: date-time, nullable: true }
    AccessToken:
      type: object
      required: [id, name, prefix, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: "The token's start, like sbp_1a2b3c, to tell tokens apart." }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        last_used_ip: { type: string, nullable: true }
    AccessTokenCreate:
      type: object
      required: [name, expires_in_days]
      properties:
        name: { type: string, description: "What it's for, like \"GitHub Actions deploys\"." }
        expires_in_days: { type: integer, minimum: 1, maximum: 365 }
    AccessTokenCreated:
      allOf:
        - { $ref: "#/components/schemas/AccessToken" }
        - type: object
          required: [token]
          properties:
            token: { type: string, description: The token (sbp_…); shown only now. }
    PasswordResetInfo:
      type: object
      required: [username, mfa_required, expires_at]
      properties:
        username: { type: string }
        mfa_required: { type: boolean, description: The account has two-factor sign-in; a code is needed as well. }
        expires_at: { type: string, format: date-time }
    PasswordResetComplete:
      type: object
      required: [password]
      properties:
        password: { type: string }
        code: { type: string, description: "With two-factor sign-in: a code from the app, or a recovery code." }
    MfaChallenge:
      type: object
      required: [mfa_required, challenge, expires_at]
      properties:
        mfa_required: { type: boolean, enum: [true] }
        challenge: { type: string, description: Pass to POST /auth/mfa with the code. }
        expires_at: { type: string, format: date-time }
    MfaVerify:
      type: object
      required: [code]
      properties:
        challenge: { type: string, description: "From POST /auth/sign-in; after single sign-on, leave it out (it's in a cookie)." }
        code: { type: string, description: The 6-digit code from the app, or a recovery code. }
    MfaStatus:
      type: object
      required: [enabled, recovery_codes_left]
      properties:
        enabled: { type: boolean }
        enabled_at: { type: string, format: date-time, nullable: true }
        recovery_codes_left: { type: integer }
    PasswordConfirm:
      type: object
      required: [password]
      properties:
        password: { type: string }
    MfaSetup:
      type: object
      required: [secret, uri, qr_svg]
      properties:
        secret: { type: string, description: "To type into the app, in groups of four." }
        uri: { type: string, description: The otpauth:// URI. }
        qr_svg: { type: string, description: The URI as a QR code (SVG). }
    MfaCode:
      type: object
      required: [code]
      properties:
        code: { type: string }
    MfaDisable:
      type: object
      required: [password, code]
      properties:
        password: { type: string }
        code: { type: string, description: A code from the app, or a recovery code. }
    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes: { type: array, items: { type: string }, description: "Single-use; each signs in once in place of a code." }
    AdminOverview:
      type: object
      required: [version, users, active_users, instance_admins, password_change_required, mfa_enabled, organizations, projects, managed_projects, provisioning, backups, email, sso, audit_drains]
      properties:
        version: { type: string }
        users: { type: integer }
        active_users: { type: integer }
        instance_admins: { type: integer, description: Active ones. }
        password_change_required: { type: integer, description: Active accounts that must still choose a new password. }
        mfa_enabled: { type: integer, description: Active accounts with two-factor sign-in. }
        organizations: { type: integer }
        projects: { type: integer }
        managed_projects: { type: integer, description: Projects whose stacks Supermixer created. }
        provisioning:
          type: object
          required: [enabled, stacks_dir, public_host]
          properties:
            enabled: { type: boolean }
            stacks_dir: { type: string }
            public_host: { type: string }
        backups:
          type: object
          required: [dir, interval_hours, keep]
          properties:
            dir: { type: string }
            interval_hours: { type: number }
            keep: { type: integer }
            s3: { type: string, nullable: true, description: "s3://bucket/prefix, if backups are copied to a bucket." }
        sso:
          type: array
          items:
            type: object
            required: [id, name, issuer, create_users, allowed_domains, redirect_uri]
            properties:
              id: { type: string }
              name: { type: string }
              issuer: { type: string }
              create_users: { type: boolean }
              allowed_domains: { type: array, items: { type: string } }
              redirect_uri: { type: string, description: To register with the provider. }
        email:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean }
            from: { type: string, nullable: true }
            server: { type: string, nullable: true, description: "host:port, and how it's secured." }
        metrics_listen: { type: string, nullable: true, description: "Where Prometheus metrics are served ([metrics] listen); null if off." }
        audit_drains:
          type: array
          items: { $ref: '#/components/schemas/AuditDrainStatus' }
    AuditDrainStatus:
      type: object
      description: Where audit log entries are sent ([[audit.drains]]), and how that's going.
      required: [id, type, target, state, pending, last_error]
      properties:
        id: { type: string }
        type: { type: string, enum: [http, file] }
        target: { type: string, description: "The URL (without its query) or file." }
        state:
          type: string
          enum: [running, not_started, unknown]
          description: "not_started: no instance has started it yet (just added, or its database row couldn't be made); unknown: its status couldn't be read."
        pending: { type: integer, format: int64, nullable: true, description: Entries not yet delivered; null if unknown. }
        last_success_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, description: "Why the last delivery failed; empty once one succeeds." }
        last_error_at: { type: string, format: date-time, nullable: true }
    Session:
      type: object
      required: [id, created_at, last_seen_at, expires_at, ip, user_agent, current]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        ip: { type: string }
        user_agent: { type: string }
        current: { type: boolean }
    OrganizationPermissions:
      type: object
      required: [organization_slug, role, permissions, projects]
      properties:
        organization_slug: { type: string }
        role: { $ref: "#/components/schemas/OrgRole" }
        permissions: { type: array, items: { type: string } }
        projects:
          type: array
          items: { $ref: "#/components/schemas/ProjectPermissions" }
    ProjectPermissions:
      type: object
      required: [ref, role, permissions]
      properties:
        ref: { type: string }
        role: { $ref: "#/components/schemas/OrgRole" }
        permissions: { type: array, items: { type: string } }

    User:
      type: object
      required: [id, username, display_name, is_instance_admin, default_password, password_change_required, mfa_enabled, identities, has_password, disabled, waiting_approval, sessions, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, nullable: true }
        display_name: { type: string }
        is_instance_admin: { type: boolean }
        default_password: { type: boolean }
        password_change_required: { type: boolean }
        mfa_enabled: { type: boolean }
        identities: { type: array, items: { type: string }, description: Sign-in providers connected to the account (their ids). }
        has_password: { type: boolean, description: False for accounts made through single sign-on until they set one. }
        disabled: { type: boolean }
        waiting_approval: { type: boolean, description: "Signed up, and waits for an instance admin's approval before it can sign in." }
        sessions: { type: integer, description: Signed-in sessions. }
        last_seen_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    UserCreate:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
        email: { type: string, nullable: true }
        display_name: { type: string }
        is_instance_admin: { type: boolean, default: false }
        require_password_change: { type: boolean, default: true, description: "They choose their own password at first sign-in." }
    UserUpdate:
      type: object
      properties:
        email: { type: string, nullable: true }
        display_name: { type: string }
        is_instance_admin: { type: boolean }
        disabled: { type: boolean }
        password_change_required: { type: boolean, description: They must choose a new password at their next request. }

    Organization:
      type: object
      required: [id, slug, name, role, permissions, project_count, mfa_required, sso_satisfied, created_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        sso_required_provider:
          type: string
          nullable: true
          description: "Members must sign in through this single sign-on provider (its id); null if not required."
        sso_satisfied:
          type: boolean
          description: "Whether your sign-in meets the organization's single sign-on rule; until it does you can see its name and leave it, nothing else."
        mfa_required:
          type: boolean
          description: "Members must use two-factor sign-in; until they turn it on they can see the organization's name and leave it, nothing else."
        role: { $ref: "#/components/schemas/OrgRole" }
        permissions: { type: array, items: { type: string } }
        project_count: { type: integer }
        project_limit:
          type: integer
          nullable: true
          description: "The most projects it may have: the lower of its own limit and the instance's; null if unlimited."
        created_at: { type: string, format: date-time }
    OrganizationCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
    OrganizationSso:
      type: object
      required: [provider, required, join_role, join_domains, providers, signed_in_with]
      properties:
        provider: { type: string, nullable: true, description: "The instance provider (sso.providers id) the organization uses." }
        provider_missing: { type: boolean, description: "The provider is no longer set up on this instance, so nothing about it is enforced." }
        required: { type: boolean, description: Members must sign in through the provider. }
        join_role:
          nullable: true
          description: People signing in through the provider join with this role; null if they don't join by themselves.
          allOf: [{ $ref: "#/components/schemas/OrgRole" }]
        join_domains: { type: array, items: { type: string }, description: "Only these email domains join; empty for anyone the provider signs in." }
        providers:
          type: array
          description: The instance's providers.
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
        signed_in_with: { type: string, nullable: true, description: The provider your current session came through, if any. }
    OrganizationSsoUpdate:
      type: object
      required: [provider, required, join_role, join_domains]
      properties:
        provider: { type: string, nullable: true }
        required: { type: boolean }
        join_role:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/OrgRole" }]
        join_domains: { type: array, items: { type: string } }
    Webhook:
      type: object
      required: [id, url, description, events, enabled, created_at, last_error]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        description: { type: string }
        events:
          type: array
          description: 'Action prefixes sent ("project.", "member."), or ["*"] for every event.'
          items: { type: string }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        last_success_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, description: "Why the last attempt failed; empty once one succeeds." }
        failing_since: { type: string, format: date-time, nullable: true }
    WebhookCreate:
      type: object
      required: [url, events]
      properties:
        url: { type: string }
        description: { type: string }
        events: { type: array, items: { type: string } }
    WebhookUpdate:
      type: object
      properties:
        url: { type: string }
        description: { type: string }
        events: { type: array, items: { type: string } }
        enabled: { type: boolean }
    WebhookCreated:
      type: object
      required: [webhook, secret]
      properties:
        webhook: { $ref: "#/components/schemas/Webhook" }
        secret: { type: string, description: "whsec_…, for checking X-Supermixer-Signature." }
    WebhookSecret:
      type: object
      required: [secret]
      properties:
        secret: { type: string }
    WebhookDelivery:
      type: object
      required: [id, event_id, event, status, error, duration_ms, created_at]
      properties:
        id: { type: integer, format: int64 }
        event_id: { type: integer, format: int64, description: The audit log entry; 0 for a test. }
        event: { type: string }
        status: { type: integer, description: The HTTP status; 0 if there was no answer. }
        error: { type: string }
        duration_ms: { type: integer }
        created_at: { type: string, format: date-time }
    OrganizationUpdate:
      type: object
      properties:
        name: { type: string }
        mfa_required: { type: boolean, description: Only someone who uses two-factor sign-in can turn this on. }

    MemberProjectRole:
      type: object
      required: [ref, name, role]
      properties:
        ref: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/ProjectRole" }
    Member:
      type: object
      required: [user_id, username, display_name, role, project_roles, mfa_enabled, joined_at]
      properties:
        user_id: { type: string, format: uuid }
        username: { type: string }
        mfa_enabled: { type: boolean }
        display_name: { type: string }
        email: { type: string, nullable: true }
        role: { $ref: "#/components/schemas/OrgRole" }
        project_roles:
          type: array
          items: { $ref: "#/components/schemas/MemberProjectRole" }
        joined_at: { type: string, format: date-time }
    ProjectRoleAssignment:
      type: object
      required: [ref, role]
      properties:
        ref: { type: string }
        role: { $ref: "#/components/schemas/ProjectRole" }
    MemberUpdate:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/OrgRole" }
        project_roles:
          type: array
          description: Replaces all of the member's project-scoped roles in this organization.
          items: { $ref: "#/components/schemas/ProjectRoleAssignment" }

    Invitation:
      type: object
      required: [id, email, role, project_roles, invited_by, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/OrgRole" }
        project_roles:
          type: array
          items: { $ref: "#/components/schemas/MemberProjectRole" }
        invited_by: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    InvitationCreate:
      type: object
      required: [role]
      properties:
        email: { type: string, description: Who the link is for (informational). }
        role: { $ref: "#/components/schemas/OrgRole" }
        project_roles:
          type: array
          items: { $ref: "#/components/schemas/ProjectRoleAssignment" }
    InvitationCreated:
      allOf:
        - { $ref: "#/components/schemas/Invitation" }
        - type: object
          required: [token, url, email_sent]
          properties:
            token: { type: string }
            url: { type: string, description: Link to share with the invitee. }
            email_sent: { type: boolean, description: The link was emailed to the invitation's address. }
            email_error: { type: string, nullable: true, description: "Why it couldn't be emailed; share the link yourself." }
    InvitationPreview:
      type: object
      required: [organization_name, organization_slug, role, email, invited_by, expires_at, valid]
      properties:
        organization_name: { type: string }
        organization_slug: { type: string }
        role: { $ref: "#/components/schemas/OrgRole" }
        email: { type: string }
        invited_by: { type: string }
        expires_at: { type: string, format: date-time }
        valid: { type: boolean, description: False once accepted or expired. }
    SignUpRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, maxLength: 254 }
        website: { type: string, description: "Leave empty. A form field people don't see; requests that fill it are dropped." }
    SignUpInfo:
      type: object
      required: [email, expires_at, approval_required]
      properties:
        email: { type: string }
        expires_at: { type: string, format: date-time }
        approval_required: { type: boolean, description: "The account will wait for an instance admin's approval." }
    SignUpComplete:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
        display_name: { type: string }
    SignUpSettings:
      type: object
      required: [enabled, allowed_domains, notify_admins, require_approval]
      properties:
        enabled: { type: boolean, description: People can create their own accounts. Needs email. }
        allowed_domains:
          type: array
          maxItems: 100
          items: { type: string }
          description: Only addresses at these domains can sign up; empty allows any.
        notify_admins: { type: boolean, description: Instance admins get an email about each new account. }
        require_approval: { type: boolean, description: "New accounts wait for an instance admin's approval before they can sign in." }
    InvitationSignUp:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
        display_name: { type: string }
        email: { type: string, nullable: true }

    DatabaseConnection:
      type: object
      required: [host, port, name, user, sslmode]
      properties:
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        name: { type: string }
        user: { type: string }
        password: { type: string, description: Write-only. Omit on update to keep the current one. }
        sslmode: { type: string, enum: [disable, prefer, require, verify-ca, verify-full] }
    ApiKeysInput:
      type: object
      description: Write-only. On update, omitted or empty keys keep their current value.
      properties:
        anon: { type: string }
        service_role: { type: string }
        publishable: { type: string }
        secret: { type: string }
        jwt_secret: { type: string }
    ProjectConnection:
      type: object
      required: [api_url, database, keys]
      properties:
        api_url: { type: string, description: "The stack's API gateway, e.g. http://localhost:8000" }
        studio_url: { type: string }
        database: { $ref: "#/components/schemas/DatabaseConnection" }
        keys: { $ref: "#/components/schemas/ApiKeysInput" }
    ProjectCreate:
      type: object
      required: [name, connection]
      properties:
        name: { type: string }
        connection: { $ref: "#/components/schemas/ProjectConnection" }
    ProjectUpdate:
      type: object
      properties:
        name: { type: string }
        connection: { $ref: "#/components/schemas/ProjectConnection" }
    ProjectTransfer:
      type: object
      required: [organization_slug]
      properties:
        organization_slug: { type: string }
    Project:
      type: object
      required: [id, ref, name, organization_slug, organization_name, api_url, studio_url, database, keys_present, role, permissions, created_at, updated_at, stack]
      properties:
        stack:
          allOf: [{ $ref: "#/components/schemas/Stack" }]
          nullable: true
        id: { type: string, format: uuid }
        ref: { type: string }
        name: { type: string }
        organization_slug: { type: string }
        organization_name: { type: string }
        api_url: { type: string }
        studio_url: { type: string }
        database:
          type: object
          required: [host, port, name, user, sslmode, uri]
          properties:
            host: { type: string }
            port: { type: integer }
            name: { type: string }
            user: { type: string }
            sslmode: { type: string }
            uri: { type: string, description: Connection string with a password placeholder. }
            read_only_user:
              type: string
              nullable: true
              description: Login that Read-only members' queries use, when one was created.
        keys_present:
          type: object
          required: [anon, service_role, publishable, secret, jwt_secret]
          properties:
            anon: { type: boolean }
            service_role: { type: boolean }
            publishable: { type: boolean }
            secret: { type: boolean }
            jwt_secret: { type: boolean }
        role: { $ref: "#/components/schemas/OrgRole" }
        permissions: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ServiceCheck:
      type: object
      required: [service, label, status, latency_ms]
      properties:
        service: { type: string, enum: [auth, rest, storage, meta, database] }
        label: { type: string }
        status: { type: string, enum: [ok, error] }
        latency_ms: { type: integer, format: int64 }
        detail: { type: string }
    HealthReport:
      type: object
      required: [status, services, checked_at]
      properties:
        status: { type: string, enum: [healthy, degraded, unhealthy] }
        services:
          type: array
          items: { $ref: "#/components/schemas/ServiceCheck" }
        postgres_version: { type: string }
        auth_version: { type: string }
        checked_at: { type: string, format: date-time }
        example_secrets:
          type: array
          items: { type: string }
          description: "From a connection test: the credentials given that are Supabase's public example values."
    LogSource:
      type: string
      enum: [api_gateway, auth, postgres, postgrest, pooler, storage, realtime, functions]
    LogEntry:
      type: object
      required: [id, timestamp, message, metadata]
      properties:
        id: { type: string }
        timestamp: { type: string, format: date-time }
        message: { type: string }
        metadata: { type: object, additionalProperties: true }
    LogPage:
      type: object
      required: [available, entries]
      properties:
        available: { type: boolean, description: Whether the stack runs log analytics. }
        entries:
          type: array
          items: { $ref: "#/components/schemas/LogEntry" }
    RequestStats:
      type: object
      required: [available, total, hours, statuses, paths]
      properties:
        available: { type: boolean }
        total: { type: integer, format: int64 }
        hours:
          type: array
          items:
            type: object
            required: [hour, count, errors]
            properties:
              hour: { type: string, format: date-time }
              count: { type: integer, format: int64 }
              errors: { type: integer, format: int64, description: Responses with status 400 or above. }
        statuses:
          type: array
          items:
            type: object
            required: [status, count]
            properties:
              status: { type: integer }
              count: { type: integer, format: int64 }
        paths:
          type: array
          description: The busiest paths, at most 20.
          items:
            type: object
            required: [method, path, count, errors]
            properties:
              method: { type: string }
              path: { type: string }
              count: { type: integer, format: int64 }
              errors: { type: integer, format: int64 }

    Lint:
      type: object
      required: [name, title, level, facing, categories, description, detail, remediation, metadata, cache_key]
      properties:
        name: { type: string, description: "The check, e.g. rls_disabled_in_public" }
        title: { type: string }
        level: { type: string, enum: [ERROR, WARN, INFO] }
        facing: { type: string, enum: [EXTERNAL, INTERNAL] }
        categories:
          type: array
          items: { type: string, enum: [SECURITY, PERFORMANCE] }
        description: { type: string }
        detail: { type: string, description: "What was found, in Markdown." }
        remediation: { type: string, description: Supabase's guide to fixing it. }
        metadata: { type: object, additionalProperties: true, description: "The object it's about: schema, name, type, …" }
        cache_key: { type: string }

    ApiKey:
      type: object
      required: [id, name, kind, secret, present, description]
      properties:
        id: { type: string, enum: [anon, service_role, publishable, secret, jwt_secret] }
        name: { type: string }
        kind: { type: string, enum: [legacy, api_key, jwt_secret] }
        secret: { type: boolean, description: Must never be exposed in a browser. }
        present: { type: boolean }
        value: { type: string, description: "Present for public keys, and for secret ones when revealed." }
        description: { type: string }

    AuditLogEntry:
      type: object
      required: [id, action, actor_username, target_type, target_id, target_name, metadata, ip, created_at]
      properties:
        id: { type: integer, format: int64 }
        action: { type: string }
        actor_id: { type: string, format: uuid, nullable: true }
        actor_username: { type: string }
        project_ref: { type: string, nullable: true }
        organization_slug: { type: string, nullable: true, description: "The entry's organization (in your own audit log)." }
        target_type: { type: string }
        target_id: { type: string }
        target_name: { type: string }
        metadata: { type: object, additionalProperties: true }
        ip: { type: string }
        created_at: { type: string, format: date-time }
    AuditLogPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AuditLogEntry" }
        next_before: { type: integer, format: int64, nullable: true }
