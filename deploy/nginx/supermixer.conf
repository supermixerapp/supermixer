# nginx in front of Supermixer: it ends HTTPS and passes everything on.
#
# Supermixer serves its web app itself (built into the binary), so nginx
# only proxies. Copy to /etc/nginx/conf.d/supermixer.conf (or
# sites-available/, then link it into sites-enabled/), replace
# supermixer.example.com, and point the certificate lines at yours. Get the
# certificate before adding this file (nginx won't load without it), e.g.
#   certbot certonly --nginx -d supermixer.example.com --deploy-hook "systemctl reload nginx"
# Steps: DEPLOY.md.
#
# In Supermixer's config:
#   [server]
#   listen = "127.0.0.1:8080"                     # only nginx reaches it
#   public_url = "https://supermixer.example.com"
#   trust_proxy = true                            # read the headers set below
#   https_listen = ""                             # nginx ends TLS

# WebSocket upgrades (the Realtime Inspector), plain keep-alive otherwise.
map $http_upgrade $supermixer_connection {
    default upgrade;
    ''      '';
}

upstream supermixer {
    server 127.0.0.1:8080;
    keepalive 16;
}

# Plain HTTP: Let's Encrypt's checks, everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name supermixer.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name supermixer.example.com;

    ssl_certificate     /etc/letsencrypt/live/supermixer.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supermixer.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:supermixer_tls:10m;
    ssl_session_timeout 1d;

    # Storage uploads go through Supermixer to the stack, up to 1 GiB per
    # request; stream them rather than buffer them to disk first.
    client_max_body_size 1g;
    proxy_request_buffering off;

    location / {
        proxy_pass http://supermixer;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # Supermixer (trust_proxy) takes the client's address from the first
        # of these it finds, so set all three: a client can't then pass its
        # own and dodge sign-in limits or the audit log.
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Tells Supermixer the request came over HTTPS: Secure cookies, HSTS.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $supermixer_connection;
        # Realtime sockets stay open; SQL queries and backups can take a while.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # Responses Supermixer passes on from a stack (an Edge Function's
        # stream, say) arrive as they're sent.
        proxy_buffering off;
    }
}
