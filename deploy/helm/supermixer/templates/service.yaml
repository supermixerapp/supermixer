apiVersion: v1
kind: Service
metadata:
  name: {{ include "supermixer.fullname" . }}
  labels: {{- include "supermixer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "supermixer.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
    {{- end }}
